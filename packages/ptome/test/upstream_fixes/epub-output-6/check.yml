description: "a cross reference to an anchor in a later AsciiDoc table cell is a link in an EPUB. asciidoctor-epub3 2.3.0 finds an anchor's chapter through the cell its document is in only once that cell has been converted, so a reference before it warns 'invalid reference to unknown anchor' and is left as [two], a link to nothing. With the document's cell-references attribute, ptome knows every cell's document before it converts any. Found building the New-York Tribune's front page for the showcase corpus (its stories set in a table, a jump line to the second page). Fails on the gem.  The gem's EPUB converter is a separate command: set ASCIIDOCTOR_EPUB3_EXE to it when ASCIIDOCTOR_EXE is the Ruby CLI."
format: epub3
quiet: true
epub_excludes:
  - {files: "EPUB/one.xhtml", pattern: "\\[two\\]"}
epub_contains:
  - {files: "EPUB/one.xhtml", pattern: "href=\"two-chapter\\.xhtml#two\""}
