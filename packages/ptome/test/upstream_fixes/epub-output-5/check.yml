description: "a cross reference to another document is its text in an EPUB. An EPUB must be complete in itself, but asciidoctor-epub3 2.3.0 links a cross reference to another document to that document's EPUB (other.epub#here), outside the container, which EPUBCheck rejects. ptome sets the reference's text. Found building the Book of Common Prayer for the showcase corpus (Morning Prayer's citations of the Bible, another work of the units corpus). Fails on the gem.  The gem's EPUB converter is a separate command: set ASCIIDOCTOR_EPUB3_EXE to it when ASCIIDOCTOR_EXE is the Ruby CLI."
format: epub3
epub_excludes:
  - {files: "EPUB/_one.xhtml", pattern: "other\\.epub"}
epub_contains:
  - {files: "EPUB/_one.xhtml", pattern: "See the other book\\."}
