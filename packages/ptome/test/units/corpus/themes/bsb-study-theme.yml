# A study Bible from the BSB study edition (bible/bsb-study): the
# reference Bible's page (`:look: reference-bible`), the cross-references
# by verse in its centre column, and at the foot the translators' notes
# run in, then the study notes in three columns, each opening with its
# verse in bold, the words it comments on bold too; the notes kept in step
# with their verses (at least six lines of text a page, each note starting
# on its verse's page as far as that allows).
extends: look
note_streams: [tn, sn]
note_stream:
  tn:
    arrangement: run_in
    font_size: 7
  sn:
    columns: 3
    column_gap: 9
    font_size: 6.5
    line_height: 1.15
    label_content: ''
    reference_content: ''
footnotes:
  text_min_lines: 6
  lag: 0
role:
  sn-ref: { font_style: bold }
  sn-excerpt: { font_style: bold }
  hebrew: { font_style: italic }
  greek: { font_style: italic }
  # (A theme note or a profile: a tinted box across the page between the
  # text and the notes, its body in two columns.)
  feature: { float: bottom, float_scope: page }
  # (Its first paragraph opening with a two-line initial.)
  theme-body-fl: { drop_lines: 2 }
  profile-body-fl: { drop_lines: 2 }
sidebar:
  role:
    feature:
      background_color: EFE9DD
      border_width: 0
      padding: [6, 9, 6, 9]
      font_size: 7.5
      columns: 2
      column_gap: 12
      title:
        font_size: 9
        font_style: bold
        text_align: center
