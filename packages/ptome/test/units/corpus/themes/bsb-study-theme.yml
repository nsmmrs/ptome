# A study Bible from the BSB study edition (bible/bsb-study): the
# reference Bible's page (`:look: reference-bible`), the cross-references
# by verse in its centre column, and at the foot the translators' notes
# run in, then the study notes in three columns, each opening with its
# verse in bold, the words it comments on bold too; the notes kept in step
# with their verses (at least six lines of text a page, each note starting
# on its verse's page as far as that allows).
extends: look
note_streams: [tn, sn]
note_stream:
  tn:
    arrangement: run_in
    font_size: 7
  sn:
    columns: 3
    column_gap: 9
    font_size: 6.5
    line_height: 1.15
    label_content: ''
    reference_content: ''
# (Verse numbers bold, and in a poem hung left of its lines.)
units:
  verse:
    label_font_style: bold
    label_hang: [poetry]
heading:
  # (Section heads in letterspaced capitals; a pericope's parallel
  # passages small under it.)
  h4:
    font_style: bold
    text_transform: uppercase
    letter_spacing: 0.08em
    font_size: 7.5
running_content_marks: v-
header:
  font_size: 7.5
  text_transform: uppercase
  letter_spacing: 0.06em
  recto:
    left: { content: '' }
    center: { content: '{page-number}' }
    right: { content: '{page-last-mark}' }
  verso:
    left: { content: '{page-first-mark}' }
    center: { content: '{page-number}' }
    right: { content: '' }
footnotes:
  text_min_lines: 6
  lag: 0
role:
  parallel: { font_size: 7, text_align: center }
  xref: { font_size: 6.5, font_family: Noto Sans }
  sn-ref: { font_style: bold }
  sn-excerpt: { font_style: bold }
  hebrew: { font_style: italic }
  greek: { font_style: italic }
  # (A theme note or a profile: a tinted box across the page between the
  # text and the notes, its body in two columns.)
  feature: { float: bottom, float_scope: page }
  # (Its first paragraph opening with a two-line initial.)
  theme-body-fl: { drop_lines: 2 }
  profile-body-fl: { drop_lines: 2 }
sidebar:
  role:
    feature:
      background_color: EFE9DD
      border_width: 0
      padding: [6, 9, 6, 9]
      font_size: 7.5
      columns: 2
      column_gap: 12
      title:
        font_size: 9
        font_style: bold
        text_align: center
