# A print reference Bible: a small trim size, two justified columns,
# small capitals for the divine name, notes and cross-references set small.
# Read by asciidoctor-pdf and by ptome (which also places footnotes at the
# bottom of the page).
extends: default
page:
  size: [5.5in, 8.5in]
  margin: [0.5in, 0.45in, 0.6in, 0.45in]
  columns: 2
  column-gap: 12
base:
  font-size: 8.5
  line-height: 1.2
  text-align: justify
heading:
  h2-font-size: 15
  h3-font-size: 10
  h4-font-size: 8.5
  h4-font-style: italic
  margin-top: 6
  margin-bottom: 3
prose:
  margin-bottom: 3
footnotes:
  font-size: 6.5
  placement: page
role:
  nd:
    text-transform: smallcaps
  wj:
    font-color: #A01818
  xref:
    font-size: 6
    font-color: #5A5A5A
  poetry:
    text-align: left
  psalm-title:
    font-style: italic
  book-title:
    font-style: italic
    text-align: center
header:
  height: 0.35in
  recto:
    center:
      content: '{chapter-title}'
  verso:
    center:
      content: '{chapter-title}'
footer:
  height: 0.4in
  recto:
    right:
      content: '{page-number}'
  verso:
    left:
      content: '{page-number}'
