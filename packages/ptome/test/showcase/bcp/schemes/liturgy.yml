# A service: petitions of a litany are bare markers; the response after
# each is printed from the section's `:response:` attribute, declared
# once, never written after every petition.
version: 2
settings:
  apparatus: "rubric"
scheme:
  litany:
    level:
      - name: "petition"
        default: true
        id: "petition-{{petition}}"
        reftext: "Petition {{petition}}"
        label: ""
        end: "{response}"
        end-role: "response"
        end-break: "line"
