    # (The Calendar's titles, its month's head and its notes.)
    c-title1: { font_size: 20, text_align: center, text_indent: 0, letter_spacing: 0.33em }
    c-title2: { font_size: 15, text_align: center, text_indent: 0, letter_spacing: 0.08em }
    c-head: { font_size: 20.5, text_align: center, text_indent: 0 }
    csp: { letter_spacing: 0.25em }
