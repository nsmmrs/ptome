    c-n8h: { font_size: 7.7, line_pitch: 8.7pt, text_align: justify, text_indent: -18, margin_left: 18 }
    c-n8c: { font_size: 7.7, line_pitch: 8.7pt, text_align: justify, text_align_last: center, text_indent: 0 }
    # (A running head's capitals, spaced wide; the King's name in small
    # capitals.)
    sp: { letter_spacing: 0.55em }
    # (A word in capitals in the text, spaced: a psalm's PSAL., a prayer's
    # first word.)
    caps: { letter_spacing: 0.25em }
    sc: { font_variant: small-caps }
    # (The Psalter's offices: Morning and Evening Prayer in larger italic
    # capitals.)
    office: { font_size: 19, text_align: center, text_indent: 0, letter_spacing: 0.2em }
    # (The page's first block's margin holds after it.)
    spacer: { margin_top: 0, margin_bottom: 0 }
    # (A rubric: in the smaller italic, its ¶ hung at the edge; the
    # Litany's opening one in the text's size; a short rubric centred.)
    rb: { font_size: 10.9, line_pitch: 13.3pt, text_align: justify, text_indent: -14.5 }
    rl: { text_align: justify, text_indent: -17 }
    qc: { font_size: 10.9, line_pitch: 13.3pt, text_align: center, text_indent: 0 }
    # (The double rule under the Psalter's title.)
    rule2: { margin_top: 6, margin_bottom: 6 }
    # (The titles of the Order for Morning Prayer, the Psalter and the
