      cal24: { page_background_image: 'image:images/cal-24.svg[]', page_running_content: none, page_margin: [42.00, 57.95, 61.52, 57.95] }
      cal25: { page_background_image: 'image:images/cal-25.svg[]', page_running_content: none, page_margin: [42.00, 57.59, 59.82, 57.59] }
      cal26: { page_background_image: 'image:images/cal-26.svg[]', page_running_content: none, page_margin: [42.00, 58.44, 61.28, 58.45] }
      cal27: { page_background_image: 'image:images/cal-27.svg[]', page_running_content: none, page_margin: [42.00, 59.05, 61.04, 59.05] }
      cal28: { page_background_image: 'image:images/cal-28.svg[]', page_running_content: none, page_margin: [42.00, 58.81, 60.55, 58.81] }
      cal29: { page_background_image: 'image:images/cal-29.svg[]', page_running_content: none, page_margin: [42.00, 58.20, 60.31, 58.20] }
      cal30: { page_background_image: 'image:images/cal-30.svg[]', page_running_content: none, page_margin: [42.00, 58.44, 65.42, 58.45] }
      cal31: { page_background_image: 'image:images/cal-31.svg[]', page_running_content: none, page_margin: [42.00, 58.69, 69.32, 58.69] }
      cal32: { page_background_image: 'image:images/cal-32.svg[]', page_running_content: none, page_margin: [42.00, 58.08, 62.01, 58.08] }
      cal33: { page_background_image: 'image:images/cal-33.svg[]', page_running_content: none, page_margin: [42.00, 57.83, 64.69, 57.83] }
      cal34: { page_background_image: 'image:images/cal-34.svg[]', page_running_content: none, page_margin: [42.00, 58.69, 62.74, 58.69] }
      # (gen.py's calendar sections end.)
  table:
    # (The Calendar's tables: Long Primer, no rules of their own, the
    # page's drawn behind them; a day to a row at the scan's pitch.)
    font_size: 10.2
    line_pitch: 12pt
    cell_padding: [0, 1, 0, 1]
    border_width: 0
    grid_width: 0
    background_color: transparent
    margin_top: 0
    margin_bottom: 0
    head:
      background_color: transparent
    body:
      stripe_background_color: transparent
    role:
      calh: { line_pitch: 12.1pt }
      # (gen.py's calendar pitches.)
      cp1194: { line_pitch: 11.94pt }
      cp1196: { line_pitch: 11.96pt }
      cp1197: { line_pitch: 11.97pt }
      cp1200: { line_pitch: 12.0pt }
      cp1201: { line_pitch: 12.01pt }
      cp1202: { line_pitch: 12.02pt }
      cp1203: { line_pitch: 12.03pt }
      cp1212: { line_pitch: 12.12pt }
      # (gen.py's calendar pitches end.)
  prose:
    margin_bottom: 0
    text_indent: 0
    orphans: 1
    widows: 1
  role:
    # (A paragraph's first line set in; one going on from the page
    # before, not.)
    pa: { text_align: justify, text_indent: 17.5 }
    'on': { text_indent: 0 }
    # (A psalm's first verse, a prayer: an initial two lines deep.)
    ini: { text_align: justify, text_indent: 0, drop_lines: 2, drop_gap: 2 }
    # (A head, a psalm's title, a response: centred.)
    ct: { text_align: center, text_indent: 0 }
    # (The running head: flush right on a recto, flush left on a verso,
    # centred over an office; its parts 28 points apart.)
    hr: { text_align: right, text_indent: 0 }
    hv: { text_align: left, text_indent: 0 }
    hc: { text_align: center, text_indent: 0 }
    gap: { width: 40 }
    # (The foot: the signature where the scan's is, the catchword flush
    # right.)
    ft: { text_align: left, text_indent: 0 }
    right: { flush: right }
    # (A rule across a cell of the Calendar: a leader of rules.)
    ld: { flush: right, leader: '—' }
