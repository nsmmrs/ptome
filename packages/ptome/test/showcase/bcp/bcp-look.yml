# The Book of Common Prayer as John Baskerville printed it at Cambridge
# in 1761 (the octavo of 1760 reissued), measured from the Bayerische
# Staatsbibliothek's copy as the Internet Archive scanned it (NOTICE.md,
# tool/bcp_1761): its leaf 150 × 236 mm; each page's text in a frame of
# printers' flowers, a lozenge and a star in turn (images/frame.svg,
# traced from the scan); the running head inside the frame, the day's
# number flush right on a recto and flush left on a verso; Great Primer
# on its own body, 17.3 points line to line; the paragraphs set in, the
# psalms' first verses and the prayers opening with initials two lines
# deep; the rubrics, the Amens, the references and the responses in
# italic; a signature and a catchword at the foot; the Calendar's months
# as ruled tables in Long Primer, each on a page of its rules. Black
# alone, as the octavo is printed.
#
# Baskervville, the ANRT's revival of Baskerville's types, and EB
# Garamond for the signs it lacks (`ptome doctor --look bcp --looksdir
# test/showcase/bcp`).
extends: ptome
tokens:
  font:
    text: { family: { print: Baskervville, screen: [Baskervville, Baskerville, serif] } }
    display: { family: { print: Baskervville, screen: [Baskervville, Baskerville, serif] }, weight: normal }
  size:
    text: { print: 14.6pt, screen: 18px }
    headings: { print: [14.6pt, 14.6pt, 14.6pt, 14.6pt, 14.6pt, 14.6pt] }
  leading: { print: 1, screen: 1.5 }
  measure: { screen: 34em }
  align: { print: justify }
  hyphenate: { print: false }
  color: { ink: '#1A1A1A', link: '#1A1A1A' }
  page: { size: [425.2pt, 669pt], margin: [40pt, 54.8pt, 52pt, 54.8pt] }
styles:
  heading: { font: display, weight: normal, color: ink }
  title: { font: display, weight: normal, color: ink }
  link: { color: ink }
pdf:
  font:
    # (The Calendar's versicle sign and its pointing hand, which
    # Baskervville lacks.)
    fallbacks: [EB Garamond]
  base:
    line_pitch: 17.31pt
    margin_break: keep
    font_expansion: 0.04
  heading:
    chapter_break_before: always
  section:
    role:
