# The Book of Common Prayer in red and black, after the octavo John
# Baskerville printed at Cambridge in 1760-61: Baskerville's types, 10½
# on 13, a page of about 5½ × 8¾ in, its text in a double rule; the rubrics, the
# red-letter days of the calendar and the offices' heads in red, the
# rest in black (the Prayer Book's rubrics are so called for the red they
# were printed in); each office opening with an initial two lines deep;
# the versicles and responses run in after their speakers in italic,
# "Priest." and "Answer."; the Psalter pointed for chanting, each verse
# numbered; the calendar's January ruled in a frame.
#
# Libre Baskerville, Baskerville revived, and Noto Serif for the
# versicle sign (`ptome doctor --look bcp --looksdir test/showcase/bcp`).
extends: ptome
tokens:
  font:
    text: { family: { print: Libre Baskerville, screen: [Libre Baskerville, Baskerville, serif] } }
    display: { family: { print: Libre Baskerville, screen: [Libre Baskerville, Baskerville, serif] }, weight: normal }
  size:
    text: { print: 9.5pt, screen: 18px }
    headings: { print: [18pt, 12pt, 10.5pt, 9.5pt, 9.5pt, 9.5pt] }
  leading: { print: 1.32, screen: 1.6 }
  measure: { screen: 34em }
  align: { print: justify }
  hyphenate: { print: true }
  color: { ink: '#1A1A1A', link: '#1A1A1A', accent: '#B01E16' }
  page: { size: [5.5in, 8.75in], margin: [0.9in, 0.7in, 0.95in, 0.7in] }
styles:
  heading: { font: display, weight: normal, color: accent }
  title: { font: display, weight: normal, color: accent }
  link: { color: ink }
pdf:
  page:
    background_image: image:images/frame.svg[fit=fill]
  font:
    # (The versicle sign, ℣, which Baskerville's revival lacks.)
    fallbacks: [Noto Serif]
  heading:
    chapter_break_before: always
    part_break_after: always
    h1:
      text_align: center
      text_transform: uppercase
      character_spacing: 3
      vertical_align: middle
    h2:
      text_align: center
      text_transform: uppercase
      character_spacing: 1.5
      margin_bottom: 10
      initial_lines: 2
      initial_font_color: B01E16
      # (The rubric before an office's first prayer passes the initial on.)
      initial_skip_roles: [rubric]
    h3:
      text_align: center
      font_style: italic
      font_size: 10.5
      margin_top: 12
      margin_bottom: 6
  prose:
    margin_bottom: 4
  role:
    # (The rubrics in red, italic and a little smaller, as the Prayer Book
    # prints its directions.)
    rubric: { font_color: B01E16, font_style: italic, font_size: 8.5, margin_bottom: 4 }
    response: { font_style: italic }
    red-letter: { font_color: B01E16, font_style: italic }
  description_list:
    term_display: inline
    term_font_style: italic
    term_suffix: '.'
    term_gap: 0.4em
    description_indent: 1em
    item_spacing: 2
  verse:
    border_left_width: 0
    padding: [0, 0, 0, 14]
    font_size: 9.5
  table:
    font_size: 7.5
    foot_background_color: transparent
    foot_font_style: normal
    caption_text_align: center
    caption_font_style: normal
    caption_text_transform: uppercase
    caption_font_size: 12
    caption_font_color: '1A1A1A'
    border_width: 0.8
    border_color: '1A1A1A'
    grid_width: 0.4
    grid_color: '1A1A1A'
    head_background_color: transparent
    head_font_style: italic
    cell_padding: [1, 3, 1, 3]
  units:
    verse:
      label_font_color: B01E16
  header:
    height: 0.6in
    vertical_align: bottom
    font_size: 8
    recto:
      left: { content: '' }
      center: { content: '[.running-head]#{section-or-chapter-title}#' }
      right: { content: '{page-number}' }
    verso:
      left: { content: '{page-number}' }
      center: { content: '[.running-head]#{part-title}#' }
      right: { content: '' }
  footer:
    height: 0.4in
    border_width: 0
    recto: { left: { content: '' }, center: { content: '' }, right: { content: '' } }
    verso: { left: { content: '' }, center: { content: '' }, right: { content: '' } }
webfonts:
  - Libre Baskerville:400,400italic,700
css: |
  h1,h2,h3{color:#b01e16}
  .rubric p,.paragraph.rubric{color:#b01e16;font-style:italic;font-size:90%}
  .red-letter{color:#b01e16;font-style:italic}
  .response{font-style:italic}
  .dlist dt{font-style:italic;display:inline}
  .dlist dt::after{content:". "}
  .dlist dd{display:inline;margin:0}
  .dlist dd::after{content:"";display:block}
  .unit{color:#b01e16}
epub-css: |
  h1,h2,h3{color:#b01e16}
  .paragraph.rubric{color:#b01e16;font-style:italic}
  .red-letter{color:#b01e16;font-style:italic}
