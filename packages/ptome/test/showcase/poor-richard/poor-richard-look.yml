# Poor Richard's Almanack for 1733 after its facsimile (George S.
# Appleton, Philadelphia, 1849, which follows Franklin's first printing):
# a small almanac page in an old-style roman, each month a page of its
# own headed by its number in the almanac's year (March is the first)
# and its days, in italic and roman between rules, its verse, then the
# calendar in seven columns ruled apart, the signs of the zodiac, the
# planets and the aspects among its figures, the proverbs running down
# the last column in italic; the title page and the front matter in
# their frames; the page number outside at the foot.
#
# Libre Caslon Text, Noto Sans Symbols and Noto Sans Symbols 2 for the
# signs, Noto Serif (`ptome doctor --look poor-richard --looksdir
# test/showcase/poor-richard`).
extends: ptome
tokens:
  font:
    text: { family: { print: Libre Caslon Text, screen: [Libre Caslon Text, Noto Sans Symbols, serif] } }
    display: { family: { print: Libre Caslon Text, screen: [Libre Caslon Text, serif] }, weight: normal }
  size:
    text: { print: 8.4pt, screen: 18px }
    headings: { print: [16pt, 10pt, 9.5pt, 8.4pt, 8.4pt, 8.4pt] }
  leading: { print: 1.18, screen: 1.5 }
  measure: { screen: 32em }
  align: { print: justify }
  hyphenate: { print: true }
  color: { ink: '#1C1C1C', link: '#1C1C1C' }
  page: { size: [4.3in, 7.25in], margin: [0.35in, 0.3in, 0.45in, 0.35in] }
styles:
  heading: { font: display, weight: normal, color: ink }
  title: { font: display, weight: normal, color: ink }
  link: { color: ink }
pdf:
  base:
    color_emoji: false
  font:
    fallbacks: [Noto Sans Symbols, Noto Sans Symbols 2, Noto Serif]
    fallback_metrics: base
  heading:
    chapter_break_before: auto
    h2:
      text_align: left
      font_size: 10
      margin_top: 0
      margin_bottom: 4
      border_width: [2, 0, 0.5, 0]
      border_color: '1C1C1C'
      padding: [3, 0, 3, 0]
    h3:
      text_align: center
      font_size: 9.5
      margin_top: 8
      margin_bottom: 4
  section:
    role:
      ruled:
        text_align: center
  prose:
    margin_bottom: 0
    text_indent: 1em
  role:
    mon: { font_style: italic }
    month: { text_align: left }
    running-title: { text_align: center, font_size: 12, text_indent: 0, margin_bottom: 4 }
    an: { text_align: center, character_spacing: 3, font_size: 9, text_indent: 0 }
    almanack: { text_align: center, font_size: 30, text_indent: 0, margin_bottom: 6 }
    for: { text_align: center, text_indent: 0 }
    year: { text_align: center, font_size: 28, character_spacing: 8, text_indent: 0, margin_bottom: 6 }
    leap: { text_align: center, text_indent: 0, margin_bottom: 4 }
    wherein: { text_align: center, text_indent: 0 }
    contents: { text_indent: 0, margin_bottom: 3 }
    by: { text_align: center, text_indent: 0, margin_bottom: 6 }
    imprint: { text_align: center, text_indent: 0 }
    salutation: { text_indent: 1em }
    signature: { text_indent: 0 }
    dropcap: { drop_lines: 2, text_indent: 0 }
    text-center: { text_indent: 0 }
    rule-above: { margin_top: 4 }
  verse:
    border_left_width: 0
    padding: [0, 0, 0, 12]
    font_size: 7.4
    line_height: 1.1
  caption:
    text_align: center
    font_style: italic
    font_size: 8.4
  table:
    font_size: 7
    cell_padding: [0.5, 1.5, 0.5, 1.5]
    border_color: '1C1C1C'
    grid_color: '1C1C1C'
    border_width: 0.75
    grid_width: 0.5
    head:
      font_style: normal
      font_size: 6.2
      background_color: transparent
      border_bottom_width: 0.5
    body:
      stripe_background_color: transparent
  title_page:
    text_align: center
  footer:
    height: 0.4in
    border_width: 0
    font_size: 7
    recto: { left: { content: '' }, center: { content: '' }, right: { content: '{page-number}' } }
    verso: { left: { content: '{page-number}' }, center: { content: '' }, right: { content: '' } }
webfonts:
  - Libre Caslon Text:400,400italic
  - Noto Sans Symbols:400
css: |
  body{font-variant-emoji:text}
  .mon{font-style:italic}
  table.calendar{font-size:75%}
  table.calendar td,table.calendar th{padding:.05em .25em}
  .title-page .paragraph p,.paragraph.text-center p{text-align:center}
  .almanack p{font-size:300%}
  .year p{font-size:280%;letter-spacing:.3em}
epub-css: |
  body{font-variant-emoji:text}
  .mon{font-style:italic}
  table.calendar{font-size:75%}
  .almanack p{font-size:250%;text-align:center}
  .year p{font-size:230%;text-align:center}
