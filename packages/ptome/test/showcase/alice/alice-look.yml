      lh161: { line_height: 1.3598 }
      lh162: { line_height: 1.3682 }
      lh163: { line_height: 1.3767 }
      lh164: { line_height: 1.3851 }
      lh165: { line_height: 1.3936 }
      lh166: { line_height: 1.4020 }
      lh167: { line_height: 1.4105 }
      lh169: { line_height: 1.4274 }
      lh189: { line_height: 1.5963 }
      lh193: { line_height: 1.6301 }
      lh196: { line_height: 1.6554 }
      lh198: { line_height: 1.6723 }
      # lh-end
    # (Wonderland's stanzas, `v<size>`, each line set in from the text's
    # edge by its own spaces, as far as the printing sets it in;
    # Looking-Glass's set in 18 pt.)
    border_left_width: 0
    padding: [0, 0, 0, 18]
    font_size: 10
    line_height: 1.284
    # (Each stanza's spaces above and below its own, `margin-top` and
    # `margin-bottom`, measured from the scan.)
    margin_top: 0
    margin_bottom: 0
  prose:
    margin_bottom: 0
    text_indent_inner: 18.2pt
    # (The printing's pages: a page holds as many lines as it has room
    # for, an orphan or a widow where the printing has one.)
    orphans: 1
    widows: 1
  table:
    border_width: 0
    font_size: 8.5
  caption:
    text_align: center
    font_style: italic
  header:
    height: 13mm
    vertical_align: bottom
    font_size: 7.5
    recto:
      left: { content: '' }
      center: { content: '[.running-head]#{chapter-title-spread}#' }
      right: { content: '{page-number}' }
    verso:
      left: { content: '{page-number}' }
      center: { content: '[.running-head]#{chapter-title-spread}#' }
      right: { content: '' }
    # (Looking-Glass's closing poem, its pages headed by their folios
    # alone, centred: its sections open their pages, their head the
    # openers'.)
    opener: { center: { content: '{page-number}' } }
  # (The printer's signatures at the foot of each gathering's first page,
  # every eight pages from B: crown octavo in eights.)
  running_content:
    signature:
      interval: 8
      first: 1
      start: B
  footer:
    height: 27.4pt
    border_width: 0
    on_openers: true
    vertical_align: top
    padding: [2.1pt, 0, 0, 0]
    font_size: 7.5
    recto: { left: { content: '' }, center: { content: '{page-signature}' }, right: { content: '' } }
    verso: { left: { content: '' }, center: { content: '{page-signature}' }, right: { content: '' } }
