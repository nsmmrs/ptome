# The Temple as Thomas Buck and Roger Daniel printed its second edition
# (Cambridge, 1633), measured from the scan of the microfilm (NOTICE.md):
# a duodecimo's 241 × 422 pt page, the verse in a roman of the time,
# 9.2 pt on 9.62; the running heads "The Church-porch.", "The Church."
# and "The Church Militant." in italic, the folio outside them (on a
# part's first page alone at its head, centred); the catchword and the
# signature on the foot line, a line below the page's last, set with the
# text (tool/temple_1633); each poem's title with its pilcrow, each line
# set in as far as the printing sets it (its own `i<tenths>` span), each
# block where the printing sets it (its own `margin-top`, fitted to the
# scan: tool/temple_1633), the pages broken where the printing breaks
# them; the Altar's lines shaping its altar, Easter-wings sideways on two
# pages.
#
# IM Fell DW Pica, with its historical forms (the long s where its rules
# put it) and its discretionary ligatures (`ptome doctor --look herbert
# --looksdir test/showcase/herbert`).
extends: ptome
tokens:
  font:
    text: { family: { print: IM Fell DW Pica, screen: [IM Fell DW Pica, serif] } }
    display: { family: { print: IM Fell DW Pica, screen: [IM Fell DW Pica, serif] }, weight: normal }
  size:
    text: { print: 9.2pt, screen: 19px }
    headings: { print: [12.6pt, 12.6pt, 12.6pt, 12.6pt, 10pt, 10pt] }
  leading: { print: 1.0457, screen: 1.55 }
  measure: { screen: 30em }
  align: { print: start }
  hyphenate: { print: false }
  color: { ink: '#1A1A1A', link: '#1A1A1A' }
  page: { size: [241pt, 422pt], margin: [32pt, 23pt, 0pt, 23pt] }
styles:
  heading: { font: display, weight: normal, color: ink }
  title: { font: display, weight: normal, color: ink }
  link: { color: ink }
pdf:
  base:
    font_variant_alternates: historical-forms
    font_variant_ligatures: discretionary-ligatures
  # (Each block's own space above it, measured from the scan, kept at the
  # top of a page too.)
  base_margin_break: keep
  # (The pages numbered as the printing numbers them: from the Church-
  # porch's first, the ninth page; headed from there.)
  page_numbering_start_at: 9
  running_content_start_at: 9
  section:
    role:
      # (The Church's first page an opening page: its folio at its head.)
      opener: { opener: true }
  heading:
    tag_shift: true
    chapter_break_before: auto
    text_align: center
    line_height: 1
    margin_top: 0
    margin_page_top: 0
    margin_bottom: 0
    h2: { font_size: 12.6 }
    h3: { font_size: 12.6 }
  prose:
    margin_bottom: 0
    margin_inner: 0
    text_indent: 0
    orphans: 1
    widows: 1
  role:
    # (A stanza: its lines its source's, set from the left.)
    v: { text_align: left, text_indent: 0 }
    # (A poem's first letter a capital two lines high.)
    dropcap: { drop_lines: 2 }
    subhead: { text_align: center, font_style: italic, font_size: 10.5, text_indent: 0, line_height: 1 }
    # (Words the printing turns up or down for want of room, after a
    # bracket, flush right.)
    turn: { flush: right }
    # (A speaker inside a line; the brace before two words stacked.)
    spk: { font_style: normal }
    brace: { font_size: 14, line_height: 0.7 }
    stage: { text_align: center, font_style: italic, font_size: 10.5, text_indent: 0, line_height: 1 }
    finis: { text_align: center, letter_spacing: 3.5pt, text_indent: 0, line_height: 1 }
    gloria: { text_align: center, font_style: italic, font_size: 11, text_indent: 0, line_pitch: 13.5pt }
    italic: { font_style: italic }
    # (The Printers to the Reader: justified, each paragraph's first line
    # set in, but a paragraph going on from the page before.)
    prose: { text_align: justify, text_indent: 0 }
    indent: { text_indent: 9.2 }
    goes-on: { text_indent: 0 }
    motto: { text_align: center, text_indent: 0 }
    # (The titles of the poems: in two columns, the titles italic, their
    # pages flush right; a letter over each letter's titles, the first two
    # beside a capital two lines high.)
    ix: { text_align: left, text_indent: 0, font_style: italic }
    ix-l: { margin_right: 103 }
    ix-r: { margin_left: 100 }
    ix-letter: { text_align: center, font_style: normal }
    ix-drop: { drop_lines: 2, drop_font_style: normal }
    rm: { font_style: normal }
    ixn: { flush: right, font_style: normal }
    ix-title: { text_align: center, text_indent: 0, font_size: 12.6, letter_spacing: 1.2, line_height: 1 }
    # (The Dedication: in a larger italic, as close set as the text.)
    ded: { font_style: italic, font_size: 11, line_pitch: 9.54pt }
    # (The title page's lines: spaced capitals of their sizes, centred,
    # measured from the scan.)
    tp-the: { text_align: center, text_indent: 0, font_size: 11.8, line_height: 1 }
    tp-temple: { text_align: center, text_indent: 0, font_size: 24.4, letter_spacing: 2.14, line_height: 1 }
    tp-sacred: { text_align: center, text_indent: 0, font_size: 15.0, letter_spacing: 1.07, line_height: 1 }
    tp-and: { text_align: center, text_indent: 0, font_size: 10.5, letter_spacing: 1.7, line_height: 1 }
    tp-private: { text_align: center, text_indent: 0, font_size: 10.5, letter_spacing: 2.54, line_height: 1 }
    tp-lations: { text_align: center, text_indent: 0, font_size: 10.5, letter_spacing: 1.25, line_height: 1 }
    tp-by: { text_align: center, text_indent: 0, font_size: 9.6, line_pitch: 9.6pt }
    tp-sc: { font_variant: small-caps, letter_spacing: 1.8 }
    tp-sc2: { font_variant: small-caps, letter_spacing: 1.0 }
    tp-ed: { text_align: center, text_indent: 0, font_size: 12.3, line_height: 1 }
    tp-psal: { text_align: center, text_indent: 0, font_size: 10.5, letter_spacing: 0.2, line_height: 1 }
    tp-motto: { text_align: center, text_indent: 0, font_size: 11.0, line_pitch: 11.7pt }
    tp-imprint: { text_align: center, text_indent: 0, font_size: 9.2, line_pitch: 9.6pt }
    # (A word in capitals, ALTAR: spaced, smaller, but its first letter.)
    spaced: { character_spacing: 2.5, font_size: 7.4 }
    spaced-cap: { character_spacing: 2.5 }
    # (The Altar: each part of its shape a paragraph as wide as the
    # printing's, its lines justified to fill it, as far apart as the
    # printing's.)
    altar: { text_align: justify, text_align_last: justify, text_indent: 0, line_pitch: 15.25pt }
    altar-1: { margin_right: 4.3 }
    altar-2: { margin_left: 19.1, margin_right: 22.8 }
    altar-3: { margin_left: 55.0, margin_right: 67.4 }
    altar-4: { margin_left: 19.6, margin_right: 28.7 }
    altar-5: { margin_right: 3.9 }
    folio: { font_style: normal }
    # (The foot line, set with each page's text where the printing sets
    # it, a line below its last: the catchword at the right, the
    # signature on the same line.)
    foot-cw: { text_align: right, text_indent: 0 }
    foot-sig: { text_align: left, text_indent: 0 }
    # (Each line set in as far as the printing sets it, each long stanza's
    # lines as far apart as the printing's: generated.)
