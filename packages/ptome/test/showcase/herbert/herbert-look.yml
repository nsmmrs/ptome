# The Temple after its first edition (Cambridge, Thomas Buck and Roger
# Daniel, 1633), a small duodecimo: a narrow page in a roman of the time
# with its long s, its ligatures and its italic; the running head "The
# Church." in italic, the page number outside; each poem's title with a
# pilcrow, its stanzas' lines set in as the poem's form asks, the
# Altar's lines shaping its altar between bands of ornament, and the
# two stanzas of Easter-wings each printed sideways on a page of its own,
# its lines a pair of wings.
#
# IM Fell DW Pica, with its historical forms (the long s where its rules
# put it) and its discretionary ligatures (`ptome doctor --look herbert
# --looksdir test/showcase/herbert`).
extends: ptome
tokens:
  font:
    text: { family: { print: IM Fell DW Pica, screen: [IM Fell DW Pica, serif] } }
    display: { family: { print: IM Fell DW Pica, screen: [IM Fell DW Pica, serif] }, weight: normal }
  size:
    text: { print: 9.5pt, screen: 19px }
    headings: { print: [18pt, 13pt, 11pt, 10pt, 10pt, 10pt] }
  leading: { print: 1.2, screen: 1.55 }
  measure: { screen: 30em }
  align: { print: start }
  hyphenate: { print: false }
  color: { ink: '#1A1A1A', link: '#1A1A1A' }
  page: { size: [3.4in, 5.8in], margin: [0.6in, 0.35in, 0.5in, 0.4in] }
styles:
  heading: { font: display, weight: normal, color: ink }
  title: { font: display, weight: normal, color: ink }
  link: { color: ink }
pdf:
  base:
    font_variant_alternates: historical-forms
    font_variant_ligatures: discretionary-ligatures
  heading:
    chapter_break_before: always
    h2:
      text_align: center
      font_size: 13
      margin_bottom: 8
    h3:
      text_align: center
      font_size: 11
      margin_top: 12
      margin_bottom: 6
  section:
    role:
      headpiece:
        border_width: [3, 0, 0, 0]
  verse:
    border_left_width: 0
    padding: [0, 0, 0, 0]
    font_size: 9.5
  role:
    italic: { font_style: italic }
    spaced: { character_spacing: 2.5, font_size: 8 }
  title_page:
    text_align: center
    title:
      top: 25%
      font_size: 16
      text_transform: uppercase
    subtitle:
      font_style: italic
      font_size: 11
    authors:
      font_size: 10
  header:
    height: 0.5in
    vertical_align: bottom
    font_size: 10
    font_style: italic
    recto:
      left: { content: '' }
      center: { content: 'The Church.' }
      right: { content: '{page-number}' }
    verso:
      left: { content: '{page-number}' }
      center: { content: 'The Church.' }
      right: { content: '' }
  footer:
    height: 0.3in
    border_width: 0
    recto: { left: { content: '' }, center: { content: '' }, right: { content: '' } }
    verso: { left: { content: '' }, center: { content: '' }, right: { content: '' } }
webfonts:
  - IM Fell DW Pica:400,400italic
css: |
  body{font-feature-settings:"hist" 1,"dlig" 1}
  #content h2,#content h3{text-align:center}
  .verseblock.italic pre{font-style:italic}
  .spaced{letter-spacing:.25em;font-size:85%}
  .verseblock.text-center pre{text-align:center}
epub-css: |
  body{font-feature-settings:"hist" 1,"dlig" 1}
  h2,h3{text-align:center}
  .verseblock.italic pre{font-style:italic}
  .spaced{letter-spacing:.25em}
