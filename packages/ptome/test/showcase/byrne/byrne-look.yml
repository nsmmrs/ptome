# Byrne's Euclid after its first edition (William Pickering, 1847), a
# small quarto: Caslon, generously leaded for the symbols the lines
# carry; each proposition on a page of its own, its diagram beside its
# enunciation, the enunciation in italic after a large initial, the
# steps of the demonstration each on a line, "Q. E. D." at the right;
# the running head in italic capitals, the page number outside; red,
# yellow, blue and black.
#
# Libre Caslon Text (`ptome doctor --look byrne --looksdir
# test/showcase/byrne`).
extends: ptome
tokens:
  font:
    text: { family: { print: Libre Caslon Text, screen: [Libre Caslon Text, serif] } }
    display: { family: { print: Libre Caslon Text, screen: [Libre Caslon Text, serif] }, weight: normal }
  size:
    text: { print: 12pt, screen: 20px }
    headings: { print: [22pt, 15pt, 13pt, 12pt, 12pt, 12pt] }
  leading: { print: 1.75, screen: 2 }
  measure: { screen: 34em }
  align: { print: start }
  hyphenate: { print: false }
  color: { ink: '#1C1C1C', link: '#1C1C1C' }
  page: { size: [7.4in, 9.3in], margin: [0.8in, 0.7in, 0.7in, 0.75in] }
styles:
  heading: { font: display, weight: normal, color: ink }
  title: { font: display, weight: normal, color: ink }
  link: { color: ink }
pdf:
  heading:
    chapter_break_before: always
    h2:
      text_align: center
      text_transform: uppercase
      font_size: 15
      margin_bottom: 6
    h3:
      text_align: center
      text_transform: uppercase
      font_size: 13
      margin_top: 0
      margin_bottom: 14
  prose:
    margin_bottom: 6
  role:
    enunciation: { font_style: italic }
    dropcap:
      drop_lines: 3
      drop_font_style: normal
    steps: { margin_top: 6 }
    qed: { text_align: right, margin_top: 4 }
  image:
    float_gap: [14, 8]
  title_page:
    text_align: center
    title:
      top: 22%
      font_size: 20
      text_transform: uppercase
      line_height: 1.3
    subtitle:
      font_style: italic
      font_size: 12
      line_height: 1.5
    authors:
      font_size: 12
      text_transform: uppercase
      margin_top: 24
  header:
    height: 0.65in
    vertical_align: bottom
    font_size: 10
    font_style: italic
    text_transform: uppercase
    recto:
      left: { content: '' }
      center: { content: 'Book I. {section-title}' }
      right: { content: '{page-number}' }
    verso:
      left: { content: '{page-number}' }
      center: { content: 'Book I. {section-title}' }
      right: { content: '' }
  footer:
    height: 0.4in
    border_width: 0
    recto: { left: { content: '' }, center: { content: '' }, right: { content: '' } }
    verso: { left: { content: '' }, center: { content: '' }, right: { content: '' } }
webfonts:
  - Libre Caslon Text:400,400italic
css: |
  #content h2,#content h3{text-align:center;text-transform:uppercase}
  .paragraph.enunciation p{font-style:italic}
  .paragraph.dropcap p::first-letter{float:left;font-style:normal;font-size:3.6em;line-height:.8;padding:.05em .1em 0 0}
  .paragraph.qed p{text-align:right}
  span.image img{zoom:1.7;vertical-align:baseline}
  .imageblock.left{float:left;margin:0 1.5em 1em 0}
  .imageblock.right{float:right;margin:0 0 1em 1.5em}
  .imageblock.left img,.imageblock.right img{zoom:1.7}
epub-css: |
  h2,h3{text-align:center;text-transform:uppercase}
  .paragraph.enunciation p{font-style:italic}
  .paragraph.qed p{text-align:right}
  span.image img{vertical-align:baseline}
