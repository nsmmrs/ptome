# The Life and Opinions of Tristram Shandy, Gentleman, Vol. I, as J.
# Dodsley printed it in London in 1770 (the eighth edition), measured from
# the Bayerische Staatsbibliothek's copy as the Internet Archive scanned
# it (NOTICE.md, tool/tristram_1770): its leaf 108 × 175 mm; the page's
# number in brackets at its head, "( 6 )", centred; English on its own
# body, 16.7 points line to line, 21 lines to the page, justified; the
# chapters running on under "C H A P. I.", each opening with an initial
# two lines deep; a quotation's lines each opening with its marks; the
# footnotes in a smaller size; the signature, the volume's direction line
# and the catchword at the foot; Yorick's epitaph in its frame of rules;
# the black page both sides of its leaf.
#
# Libre Caslon Text, Caslon revived; UnifrakturMaguntia for the
# settlement's black letter; Noto Serif for the Greek and Noto Sans
# Symbols for the cross (`ptome doctor
# --look tristram --looksdir test/showcase/tristram`).
extends: ptome
tokens:
  font:
    text: { family: { print: Libre Caslon Text, screen: [Libre Caslon Text, serif] } }
    display: { family: { print: Libre Caslon Text, screen: [Libre Caslon Text, serif] }, weight: normal }
  size:
    text: { print: 10.4pt, screen: 18px }
    headings: { print: [10.4pt, 10.4pt, 10.4pt, 10.4pt, 10.4pt, 10.4pt] }
  leading: { print: 1, screen: 1.6 }
  measure: { screen: 32em }
  align: { print: justify }
  hyphenate: { print: false }
  color: { ink: '#1A1A1A', link: '#1A1A1A' }
  page: { size: [306pt, 496pt], margin: [30pt, 53.6pt, 40pt, 42pt] }
styles:
  heading: { font: display, weight: normal, color: ink }
  title: { font: display, weight: normal, color: ink }
  link: { color: ink }
pdf:
  font:
    # (The title page's Greek and the cross Dr. Slop makes, which
    # Caslon's revival lacks.)
    fallbacks: [Noto Serif, Noto Sans Symbols]
  base:
    line_pitch: 16.73pt
    margin_break: keep
    font_expansion: 0.04
  heading:
    chapter_break_before: always
  section:
    role:
      # (A recto's margins and a verso's: the inner the narrower.)
      recto: { page_running_content: none, page_margin: [30, 53.6, 40, 42] }
      verso: { page_running_content: none, page_margin: [30, 42, 40, 53.6] }
      # (The frontispiece: the leaf as the scan shows it, its paper
      # whitened.)
      front: { page_background_image: 'image:images/frontispiece.png[]', page_running_content: none }
      # (The black pages: their ink where the scan's is; the first page:
      # the rule under its title.)
      # (gen.py's sections.)
      first: { page_background_image: 'image:images/rule-1.svg[]', page_running_content: none, page_margin: [30, 53.6, 40, 42] }
      black67: { page_background_image: 'image:images/black-67.svg[]', page_running_content: none, page_margin: [30, 53.6, 40, 42] }
      black68: { page_background_image: 'image:images/black-68.svg[]', page_running_content: none, page_margin: [30, 42, 40, 53.6] }
      # (gen.py's sections end.)
  image:
    caption: { display: none }
  table:
    margin_top: 0
    margin_bottom: 0
    background_color: transparent
    head: { background_color: transparent }
    body: { stripe_background_color: transparent }
    role:
      # (Yorick's epitaph: its frame of rules.)
      yk: { border_width: 0.8, border_color: '1A1A1A', grid_width: 0, cell_padding: [3, 6, 2, 6], line_pitch: 16.73pt }
  prose:
    margin_bottom: 0
    text_indent: 0
    orphans: 1
    widows: 1
  role:
    # (A paragraph's first line set in; one going on, not.)
    pa: { text_align: justify, text_indent: 12.3 }
    'on': { text_indent: 0 }
    # (A paragraph parted where the scan's lines lie unevenly: its part
    # above justified to its last line.)
    jl: { text_align_last: justify }
    # (A chapter's first line: an initial two lines deep.)
    ini: { text_align: justify, text_indent: 0, drop_lines: 2, drop_gap: 1.5 }
    # (A chapter's head, a centred line; a line flush right.)
    ct: { text_align: center, text_indent: 0 }
    rt: { text_align: right, text_indent: 0 }
    # (The head: the page's number, centred.)
    hd: { text_align: center, text_indent: 0 }
    # (The foot: the signature where the scan's is, the catchword flush
    # right.)
    ft: { text_align: left, text_indent: 0 }
    right: { flush: right }
    # (The footnotes: the smaller size, set in.)
    fn: { font_size: 8.8, line_pitch: 14pt, text_align: justify, text_indent: 12.3 }
    # (The dedication: in a larger size, Great Primer.)
    dd: { font_size: 12 }
    # (A word in capitals, spaced as the printing spaces them.)
    caps: { letter_spacing: 0.22em }
    sc: { font_variant: small-caps }
    # (The settlement's black letter, Great Primer.)
    bl: { font_family: UnifrakturMaguntia, font_size: 18 }
    # (The page's first block's margin holds after it.)
    spacer: { margin_top: 0, margin_bottom: 0 }
    # (The title page's lines, the first page's and the dedication's, each
    # in its own size, its letters spaced, as the scan measures them.)
    t-the: { font_size: 10.6, text_align: center, text_indent: 0, letter_spacing: 1.16em }
    t-life: { font_size: 25.2, text_align: center, text_indent: 0, letter_spacing: 1.154em }
    t-and: { font_size: 11, text_align: center, text_indent: 0, letter_spacing: 1.173em }
    t-opinions: { font_size: 24.7, text_align: center, text_indent: 0, letter_spacing: 0.342em }
    t-of: { font_size: 9.9, text_align: center, text_indent: 0, letter_spacing: 1.847em }
    t-tristram: { font_size: 16, text_align: center, text_indent: 0, letter_spacing: 0.143em }
