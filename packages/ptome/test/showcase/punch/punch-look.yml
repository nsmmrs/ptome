# Punch, or the London Charivari after its first volume (1841), a weekly
# of about 8¼ × 11 in: the running head its title, "PUNCH, OR THE LONDON
# CHARIVARI.", in large capitals over a rule, the page number outside;
# each issue headed "FOR THE WEEK ENDING JULY 17, 1841." in small italic
# capitals; its pieces in two columns ruled apart, small and close,
# their heads in capitals, centred; short rules between the pieces; the
# cuts in the columns with their captions in capitals under them, a
# large cut across the page; a piece's first letter a picture.
#
# Old Standard TT stands in for the Scotch roman of the time (`ptome
# doctor --look punch --looksdir test/showcase/punch`).
extends: ptome
tokens:
  font:
    text: { family: { print: Old Standard TT, screen: [Old Standard TT, serif] } }
    display: { family: { print: Old Standard TT, screen: [Old Standard TT, serif] }, weight: normal }
  size:
    text: { print: 8.5pt, screen: 18px }
    headings: { print: [24pt, 11pt, 8.5pt, 8pt, 8pt, 8pt] }
  leading: { print: 1.18, screen: 1.55 }
  measure: { screen: 34em }
  paragraph: { signal: indent, indent: { print: 1em } }
  align: { print: justify }
  hyphenate: { print: true }
  color: { ink: '#1A1A1A', link: '#1A1A1A' }
  page: { size: [8.25in, 11in], margin: [0.85in, 0.6in, 0.6in, 0.6in] }
styles:
  heading: { font: display, weight: normal, color: ink }
  title: { font: display, weight: normal, color: ink }
  link: { color: ink }
pdf:
  font:
    fallbacks: [Noto Serif]
  heading:
    chapter_break_before: always
    h2:
      text_align: center
      # (The issue's week.)
      content: "For the Week ending {{title}}."
      text_transform: uppercase
      font_style: italic
      font_size: 8
      character_spacing: 0.5
      margin_bottom: 8
    h3:
      text_align: center
      text_transform: uppercase
      font_size: 8.5
      character_spacing: 0.5
      margin_top: 8
      margin_bottom: 4
    h4:
      text_align: center
      font_size: 8
      margin_top: 4
      margin_bottom: 3
  columns:
    gap: 12
    rule_width: 0.5
    rule_color: '1A1A1A'
  prose:
    margin_bottom: 0
    text_indent_inner: 1em
  thematic_break:
    border_width: 0.5
    border_color: '1A1A1A'
    margin_top: 4
    margin_bottom: 6
  role:
    hide: { display: none }
    emph: { font_style: bold }
    sc: { font_variant: small-caps }
    signature: { text_align: right, font_style: italic }
  image:
    align: center
  image_role_cut_scope: page
  caption:
    text_align: center
    font_size: 7
    text_transform: uppercase
    font_style: normal
  verse:
    border_left_width: 0
    padding: [0, 0, 0, 12]
    font_size: 8
  table:
    font_size: 7.5
    border_width: 0
    grid_width: 0
    cell_padding: [1, 3, 1, 3]
    head_background_color: transparent
  footnotes:
    font_size: 7
  running_content_on_openers: true
  header:
    height: 0.75in
    vertical_align: bottom
    font_size: 15
    character_spacing: 1.5
    border_width: 1
    border_color: '1A1A1A'
    recto:
      left: { content: '' }
      center: { content: 'PUNCH, OR THE LONDON CHARIVARI.' }
      right: { content: '{page-number}' }
    verso:
      left: { content: '{page-number}' }
      center: { content: 'PUNCH, OR THE LONDON CHARIVARI.' }
      right: { content: '' }
  footer:
    height: 0.4in
    border_width: 0
    recto: { left: { content: '' }, center: { content: '' }, right: { content: '' } }
    verso: { left: { content: '' }, center: { content: '' }, right: { content: '' } }
webfonts:
  - Old Standard TT:400,400italic,700
css: |
  .sect1.issue>h2::before{content:"PUNCH, OR THE LONDON CHARIVARI.";display:block;font-size:1.6em;font-style:normal;letter-spacing:.05em;border-bottom:2px solid #1a1a1a;margin-bottom:.4em}
  .sect1.issue>h2{text-align:center;font-style:italic;text-transform:uppercase;font-size:1em}
  #content h3,#content h4{text-align:center;text-transform:uppercase}
  .sect1.issue>.sectionbody{column-count:2;column-rule:1px solid #1a1a1a;column-gap:2em}
  .hide{display:none}
  .emph{font-weight:bold}
  .sc{font-variant:small-caps}
  .imageblock.initial{float:left;width:40%;margin:0 .5em .3em 0}
epub-css: |
  h2{text-align:center}
  h3,h4{text-align:center;text-transform:uppercase}
  .hide{display:none}
  .emph{font-weight:bold}
  .imageblock.initial{float:left;width:40%;margin:0 .5em .3em 0}
