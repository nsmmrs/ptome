# Punch's first volume (1841) as it prints its pages, measured from the
# Internet Archive's scan of the volume (NOTICE.md, tool/punch_1841):
# its 530 × 676 pt page; the running head "PUNCH." over a double rule,
# the folio outside; two columns of small, close type ruled apart; each
# piece's head in capitals, centred; short rules between the pieces; the
# cuts where the volume sets them, cut from the scan; each page's lines
# the volume's.
#
# Old Standard TT stands in for the Scotch roman of the time (`ptome
# doctor --look punch --looksdir test/showcase/punch`).
extends: ptome
tokens:
  font:
    text: { family: { print: Old Standard TT, screen: [Old Standard TT, serif] } }
    display: { family: { print: Old Standard TT, screen: [Old Standard TT, serif] }, weight: normal }
  size:
    text: { print: 6.9pt, screen: 18px }
    headings: { print: [16pt, 8pt, 7pt, 7pt, 7pt, 7pt] }
  leading: { print: 1, screen: 1.55 }
  measure: { screen: 34em }
  align: { print: justify }
  hyphenate: { print: false }
  color: { ink: '#1A1A1A', link: '#1A1A1A' }
  page: { size: [530.5pt, 676.4pt], margin: [56pt, 43.9pt, 30pt, 58.8pt] }
styles:
  heading: { font: display, weight: normal, color: ink }
  title: { font: display, weight: normal, color: ink }
  link: { color: ink }
pdf:
  base:
    line_pitch: 7.02pt
    margin_break: keep
    font_expansion: 0.06
  font:
    fallbacks: [Noto Serif]
  page:
    columns: 2
    column_gap: 4
    column_rule_width: 0.6
    column_rule_color: '1A1A1A'
  heading:
    chapter_break_before: auto
  section:
    role:
      verso: { page_margin: [56, 43.9, 30, 58.8], header_on_openers: true }
      recto: { page_margin: [56, 51.1, 30, 53.2], header_on_openers: true }
      # (A plate: one column across the page, no running head, its title,
      # its engraving and its captions; its back blank.)
      plate: { page_margin: [10, 30, 10, 30], page_columns: 1, page_running_content: none }
      blank: { page_margin: [20, 40, 20, 40], page_columns: 1, page_running_content: none }
      # (The Synopsis of Voting, set sideways across its page: drawn whole,
      # tool/punch_1841/p3.py's.)
      p3: { page_background_image: 'image:images/synopsis.svg[]', page_margin: [20, 40, 20, 40], page_columns: 1, page_running_content: none }
  prose:
    margin_bottom: 0
    text_indent: 0
    # (A paragraph's lines where the volume's are: one alone beside or
    # under a cut too.)
    orphans: 1
    widows: 1
  thematic_break:
    role:
      rule: { margin_top: 2, margin_bottom: 2, border_width: 0.5, border_color: '1A1A1A' }
      # (The long rule over a table.)
      trule: { margin_top: 2, margin_bottom: 0, border_width: 0.5, border_color: '1A1A1A', width: 181 }
  role:
    # (A paragraph's first line set in; one going on from the column
    # before, not.)
    pa: { text_align: justify, text_indent: 8 }
    'on': { text_indent: 0 }
    # (A piece's head in heavy capitals; a head within a piece in small
    # capitals.)
    hd: { text_align: center, text_indent: 0, font_style: bold, character_spacing: 0.4 }
    # (A head in roman capitals, spaced.)
    kh: { text_align: center, text_indent: 0, character_spacing: 0.4 }
    sh: { text_align: center, text_indent: 0, font_variant: small-caps, font_size: 4.8, character_spacing: 0.5, line_pitch: 5pt }
    cap: { text_align: center, text_indent: 0, font_size: 6 }
    # (A footnote at a column's foot, in the volume's smallest type.)
    fn: { text_align: justify, text_indent: 6, font_size: 5.6, line_pitch: 6pt }
    vs: { text_align: left, text_indent: 0 }
    # (A verse's long line the column turns: the turnover hung in.)
    vh: { text_align: justify, margin_left: 8.4, text_indent: -8.4 }
    tr: { text_align: left, text_indent: 0 }
    week: { text_align: center, text_indent: 0, font_style: italic }
    sc: { font_variant: small-caps }
    right: { flush: right }
    # (A line set a little closer, as the volume's compositor set it to
    # get it in.)
    tight: { character_spacing: -0.15 }
    # (The alphabet's letters, in a fat face.)
    ini: { font_style: bold }
    # (A playbill's name, its capitals spaced wide.)
    wide: { character_spacing: 5 }
    # (Dots led to a table's figure.)
    ldr: { flush: right, leader: "\u00a0\u00a0\u00a0." }
    # (A cut the lines run beside, to its side.)
    cutl: { float: left }
    cutr: { float: right }
    # (A block under a boxed list and the remarks beside it.)
    clr: { clear: true }
    # (Each paragraph's pitch, the scan's.)
    # (The pitches: gen.py's.)
