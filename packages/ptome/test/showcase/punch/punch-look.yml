  table:
    role:
      # (Punch's thermometer: the body's type, its lines the scan's apart,
      # rules either side of its figures, dots led to them.)
      # (A letter boxed beside a playbill: a hairline round it.)
      lbox: { border_width: 0.5, border_color: '1A1A1A', cell_padding: [1.5, 2, 1.5, 2] }
      # (A prescription's lines, a physician's: the body's type, dots led
      # to the figures.)
      rx: { font_size: 6.6, line_height: 0.56 }
      # (A plate's captions over and under its engraving.)
      plcap: { font_size: 6, line_height: 0.6 }
      therm: { font_size: 6.6, line_height: 0.53, grid_width: 0.5, grid_color: '1A1A1A' }
    # (Two things side by side in a column, a poem's two columns: in the
    # volume's smaller type, its lines 5.9 points apart.)
    font_size: 5.6
    line_height: 0.67
    border_width: 0
    grid_width: 0
    cell_padding: [0, 0, 0, 0]
    background_color: transparent
    body:
      stripe_background_color: transparent
  image:
    align: center
  running_content_on_openers: true
  header:
