    vertical_align: bottom
    font_size: 13
    character_spacing: 2
    border_width: 0.8
    border_color: '1A1A1A'
    padding: [0, 0, 3, 0]
    recto:
      left: { content: '' }
      center: { content: 'PUNCH.' }
      right: { content: '{page-number}' }
    verso:
      left: { content: '{page-number}' }
      center: { content: 'PUNCH.' }
