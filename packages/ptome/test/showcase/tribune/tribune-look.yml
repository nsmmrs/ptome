    s-rlr: { text_align: right, text_indent: 0 }
    s-rd: { text_align: center, text_indent: 0 }
    s-cr: { text_align: center, text_indent: 0 }
    s-cap: { text_align: center, text_indent: 0, letter_spacing: 0.12em }
    s-capt: { text_align: center, text_indent: 0 }
    s-capi: { font_style: italic, text_align: center, text_indent: 0 }
    s-adi: { font_style: italic, text_align: center, text_indent: 0 }
    s-jump: { font_style: bold, text_align: center, text_indent: 0 }
    s-ad: { font_family: Fira Sans Condensed, font_style: bold, text_align: center, text_indent: 0, letter_spacing: 0.1em }
    s-tv0: { text_align: center, text_indent: 0, letter_spacing: 0.04em }
    s-tv2: { text_align: center, text_indent: 0, letter_spacing: 0.04em }
    s-tv3: { font_style: bold, text_align: center, text_indent: 0 }
    s-tv4: { font_style: bold, text_align: center, text_indent: 0 }
    s-tv5: { font_style: bold, text_align: center, text_indent: 0 }
    s-hm0: { text_align: center, text_indent: 0 }
    s-hm1: { text_align: center, text_indent: 0 }
    s-hm2: { text_align: center, text_indent: 0 }
    # (The tally of the lost: dots led to its figures; the totals set in.)
    tally: { text_align: left, text_indent: 0 }
    tally-in: { text_align: left, text_indent: 0, margin_left: 14 }
    dots: { flush: right, leader: '. ' }
    # (The folio line: its parts where the paper's are.)
    folio2: { text_align: left, text_indent: 0 }
    right: { flush: right }
    # (A paragraph's lines set in two blocks: the first's last line full.)
    jl: { text_align_last: justify }
