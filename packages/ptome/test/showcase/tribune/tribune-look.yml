# The New-York Tribune of Tuesday, 16 April 1912, its first two pages as
# the paper prints them, measured from the Library of Congress's scan
# (Chronicling America; NOTICE.md, tool/tribune_1912): the page the
# scan's size at its 400 pixels to the inch; seven columns ruled apart,
# the stories in the cells of a table whose columns are the scan's; each
# region's text inside its column where the scan's is, each line its
# size from its width on the scan; the heads in an extra condensed
# gothic, a condensed gothic, a bold roman or a light one, as the paper
# sets them; the title, the map and the pictures, the ship's section and
# the cut advertisements cut from the scan.
#
# Old Standard TT (the text and the roman heads), Fira Sans Condensed
# (the gothic heads, the names), League Gothic (the extra condensed
# heads) (`ptome doctor --look tribune --looksdir test/showcase/tribune`).
extends: ptome
tokens:
  font:
    text: { family: { print: Old Standard TT, screen: [Old Standard TT, serif] } }
    display: { family: { print: Fira Sans Condensed, screen: [Fira Sans Condensed, sans-serif] }, weight: bold }
  size:
    text: { print: 7pt, screen: 17px }
    headings: { print: [7pt, 7pt, 7pt, 7pt, 7pt, 7pt] }
  leading: { print: 1, screen: 1.45 }
  measure: { screen: 40em }
  align: { print: justify }
  hyphenate: { print: false }
  color: { ink: '#161616', link: '#161616' }
  page: { size: [1126.08pt, 1713.6pt], margin: [0, 0, 0, 0] }
styles:
  heading: { font: display, weight: bold, color: ink }
  title: { font: display, weight: bold, color: ink }
  link: { color: ink }
pdf:
  base:
    margin_break: keep
    font_expansion: 0.05
  running_content:
    start_at: 99
  heading:
    chapter_break_before: always
  section:
    role:
      page1: { page_running_content: none }
      page2: { page_running_content: none }
  prose:
    margin_bottom: 0
    text_indent: 0
    orphans: 1
    widows: 1
  image:
    align: center
  table:
    cell_padding: 0
    border_color: '161616'
    grid_color: '161616'
    border_width: 0
    grid_width: 0.5
    background_color: transparent
    margin_top: 0
    margin_bottom: 0
    head:
      background_color: transparent
    body:
      stripe_background_color: transparent
  role:
    cut: { margin_top: 0, margin_bottom: 0 }
    spacer: { margin_top: 0, margin_bottom: 0 }
    # (The faces of the text: the roman, the bold roman, the gothic of the
    # names.)
    f-roman: { text_align: justify }
    f-bold: { text_align: justify, font_style: bold }
    f-gothic: { text_align: justify, font_family: Fira Sans Condensed, font_style: bold }
    f-gothicl: { text_align: justify, font_family: Libre Franklin, font_style: normal }
    # (The heads: each style its face and its line's place.)
    s-xc: { font_family: League Gothic, font_style: normal, text_align: center, text_indent: 0 }
    s-xcr: { font_family: League Gothic, font_style: normal, text_align: right, text_indent: 0 }
    s-xcl: { font_family: League Gothic, font_style: normal, text_align: left, text_indent: 0 }
    s-gc: { font_family: Fira Sans Condensed, font_style: bold, text_align: center, text_indent: 0 }
    s-gcc: { font_family: Fira Sans Condensed, font_style: bold, text_align: center, text_indent: 0 }
    s-gb: { font_family: Fira Sans Condensed, font_style: bold, text_align: center, text_indent: 0 }
    s-gbl: { font_family: Fira Sans Condensed, font_style: bold, text_align: left, text_indent: 0 }
    s-gbr: { font_family: Fira Sans Condensed, font_style: bold, text_align: right, text_indent: 0 }
    s-sb: { font_family: Fira Sans Condensed, font_style: bold, text_align: center, text_indent: 0 }
    s-banl: { font_style: bold, text_align: left, text_indent: 0 }
    s-banr: { font_style: bold, text_align: right, text_indent: 0 }
    c-justify: { text_align: justify, text_indent: 0, text_align_last: justify }
    c-center: { text_align: center, text_indent: 0 }
    s-rb: { font_style: bold, text_align: center, text_indent: 0 }
    s-cb: { font_style: bold, text_align: center, text_indent: 0 }
    s-cbn: { font_style: bold, text_align: center, text_indent: 0 }
    s-cbc: { font_style: bold, text_align: center, text_indent: 0 }
    s-adb: { font_style: bold, text_align: center, text_indent: 0 }
