# The New-York Tribune's front page of 16 April 1912 after the Library
# of Congress's scan: a broadsheet of seven columns ruled apart, the
# blackletter title between its ears, the folio line between rules,
# the banner across the page in bold gothic capitals; each story under
# its headline in condensed gothic capitals or a Cheltenham-like roman,
# its decks between short rules; the text small and close, justified;
# the stories that go on inside ending in a jump line.
#
# UnifrakturMaguntia (the title), Fira Sans Condensed (the gothic
# heads), Old Standard TT (the text and the roman heads)
# (`ptome doctor --look tribune --looksdir test/showcase/tribune`).
extends: ptome
tokens:
  font:
    text: { family: { print: Old Standard TT, screen: [Old Standard TT, serif] } }
    display: { family: { print: Fira Sans Condensed, screen: [Fira Sans Condensed, sans-serif] }, weight: bold }
  size:
    text: { print: 6.5pt, screen: 17px }
    headings: { print: [30pt, 15pt, 10pt, 8pt, 7pt, 7pt] }
  leading: { print: 1.06, screen: 1.45 }
  measure: { screen: 40em }
  align: { print: justify }
  hyphenate: { print: true }
  color: { ink: '#161616', link: '#161616' }
  page: { size: [17.5in, 26.5in], margin: [0.45in, 0.4in, 0.5in, 0.4in] }
styles:
  heading: { font: display, weight: bold, color: ink }
  title: { font: display, weight: bold, color: ink }
  link: { color: ink }
pdf:
  running_content:
    start_at: 2
  prose:
    margin_bottom: 0
    text_indent: 0.8em
  heading:
    h2:
      text_align: center
      font_size: 14
      line_height: 1.0
      margin_top: 0
      margin_bottom: 3
  role:
    masthead: { font_family: UnifrakturMaguntia, font_size: 64, font_style: normal }
    banner: { font_family: Fira Sans Condensed, font_style: bold, font_size: 50, text_align: center, text_indent: 0, line_height: 1.0, margin_bottom: 6, hyphens: false }
    deck: { font_style: bold, font_size: 8.5, text_align: center, text_indent: 0, line_height: 1.1, margin_bottom: 4 }
    crossline: { font_family: Fira Sans Condensed, font_style: bold, font_size: 11, text_align: center, text_indent: 0, margin_bottom: 4 }
    subhead: { font_style: bold, text_align: center, text_indent: 0 }
    crosshead: { font_style: bold, text_align: center, text_indent: 0, margin_top: 2 }
    dateline: { font_style: bold }
    names: { text_indent: 0, font_size: 6.2, line_height: 1.0 }
    advt: { font_size: 6.4, text_align: center, text_indent: 0, margin_top: 4 }
    jump: { font_size: 6.4, font_style: italic, text_align: center, text_indent: 0, margin_top: 3 }
    jumped: { margin_bottom: 0 }
    jumped-in: { text_indent: 0 }
    art-head: { font_size: 8, text_align: center, text_indent: 0, character_spacing: 0.6, margin_bottom: 3 }
    caption-head: { font_size: 6.4, text_align: center, text_indent: 0, character_spacing: 0.4 }
    caption-text: { font_size: 6.4, font_style: italic, text_align: center, text_indent: 0 }
  table:
    font_size: 6.5
    cell_padding: [2, 4, 2, 4]
    border_color: '161616'
    grid_color: '161616'
    border_width: 0.6
    grid_width: 0.5
    head:
      background_color: transparent
    body:
      stripe_background_color: transparent
  columns:
    rule_width: 0.4
    gap: 8
  header:
    height: 0.45in
    vertical_align: bottom
    font_size: 8
    border_width: 0.5
    recto:
      left: { content: '{page-number}' }
      center: { content: 'NEW-YORK DAILY TRIBUNE, TUESDAY, APRIL 16, 1912.' }
      right: { content: '' }
    verso:
      left: { content: '{page-number}' }
      center: { content: 'NEW-YORK DAILY TRIBUNE, TUESDAY, APRIL 16, 1912.' }
      right: { content: '' }
  footer:
    height: 0.3in
    border_width: 0
    recto: { left: { content: '' }, center: { content: '' }, right: { content: '' } }
    verso: { left: { content: '' }, center: { content: '' }, right: { content: '' } }
webfonts:
  - Old Standard TT:400,400italic,700
  - Fira Sans Condensed:700
  - UnifrakturMaguntia:400
css: |
  .masthead{font-family:UnifrakturMaguntia,serif;font-size:300%}
  .banner p{font-family:"Fira Sans Condensed",sans-serif;font-weight:700;font-size:200%;text-align:center;line-height:1.05}
  .deck p,.crossline p,.subhead p,.crosshead p,.art-head p,.caption-head p,.caption-text p,.advt p,.jump p{text-align:center}
  .deck p,.subhead p,.crosshead p{font-weight:700}
  .crossline p{font-family:"Fira Sans Condensed",sans-serif;font-weight:700}
  .dateline{font-weight:700}
  .jump p{font-style:italic;font-size:85%}
  .advt p{font-size:85%}
  h2{text-align:center}
  table.front>tbody>tr>td{vertical-align:top}
epub-css: |
  .masthead{font-size:250%}
  .banner p{font-weight:700;font-size:160%;text-align:center}
  .deck p,.crossline p,.subhead p,.crosshead p,.jump p{text-align:center}
  h2{text-align:center}
