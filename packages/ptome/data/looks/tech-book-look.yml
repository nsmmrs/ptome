# The tech book: the O'Reilly animal books, measured (TASK-b2qvkf) from
# one of 2018: a 7 × 9.1875 in trim; a 30 pc text block with 1 in side
# margins; body 10.5 on 12.6; headings in a semibold condensed sans, a
# chapter's sections at 18.9 pt; code 8.5 on 10.2, indented 17 pt; a
# running foot (the page number outside, the chapter or section beside
# it), no head; notes and warnings as an uppercase label between 0.5 pt
# rules, without icons. Constant-width bold (user input, `*`ls`*`) and
# italic (replaceable text, `_`file`_`) are the code face's own.
#
# The faces' free stand-ins: Crimson Pro for Minion, Fira Sans
# Condensed (its semibold) for Myriad Condensed, Ubuntu Mono for Ubuntu
# Mono itself (`ptome doctor --look tech-book` installs them).
tokens:
  font:
    text: { family: { print: Crimson Pro, screen: Crimson Pro } }
    display: { family: Fira Sans Condensed, weight: 600 }
    code: { family: Ubuntu Mono, size: 0.95 }
  size:
    text: { print: 10.5pt, screen: 20px }
    # The book's title, chapters (a book's level 1), sections, the rest.
    headings: { print: [30pt, 27pt, 18.9pt, 14pt, 11.5pt, 10.5pt], screen: [2.4em, 2.1em, 1.6em, 1.3em, 1.1em, 1em] }
  leading: { print: 1.2, screen: 1.5 }
  measure: { screen: 34em }
  paragraph: { signal: space, space: { print: 6.3pt } }
  align: { print: justify }
  hyphenate: { print: true }
  color:
    ink: '#000000'
    link: { print: '#000000', screen: '#9B0000', ebook: '#9B0000' }
    muted: '#555555'
  rule: { hairline: { print: 0.5pt, screen: 1px, ebook: 1px } }
  # 30 pc of 7 in: 1 in each side.
  page: { size: [7in, 9.1875in], margin: [0.875in, 1in, 0.875in, 1in] }
styles:
  heading: { font: display, color: ink, space-before: { print: 18pt }, space-after: { print: 6pt }, leading: 1.15, keep-with-next: true }
  title: { font: display, color: ink }
  subtitle: { font: display, weight: normal, color: ink }
  link: { color: link }
  code: { color: ink }
  code-block: { size: { print: 8.5pt }, leading: 1.2, color: ink, background: none, border: none }
  caption: { font: text, style: italic, weight: normal, size: 1, color: ink }
  sidebar: { background: none, border: { width: hairline, color: ink } }
  sidebar-title: { font: display, color: ink }
  admonition-label: { font: display, color: ink }
  table: { frame: none, rows: { width: hairline, color: ink }, columns: none, head-rule: { width: hairline, color: ink } }
  table-head: { font: display, background: none }
templates:
  title-page:
    recto:
      - { slot: title, space-before: { print: 2.5in } }
      - { slot: subtitle, space-before: { print: 6pt } }
      - { slot: authors, space-before: { print: 3in }, separator: ' and ' }
    verso:
      - { attribute: copyright, space-before: { print: 4in } }
      - { attribute: publisher }
      - revision
pdf:
  title_page:
    text_align: left
    title: { font_size: 30, font_color: '000000' }
    subtitle: { font_size: 18, font_color: '000000' }
    authors: { font_size: 12, font_color: '000000' }
  # Code indented 17 pt, nothing around it.
  code:
    padding: [0, 0, 0, 17]
  # An uppercase label between 0.5 pt rules.
  admonition:
    padding: [6, 0, 6, 0]
    border_width: [0.5, 0, 0.5, 0]
    border_color: '000000'
    column_rule_width: 0
    label:
      text_transform: uppercase
      font_size: 9
      vertical_align: top
      padding: [1.5, 12, 0, 0]
  # The running foot: the page number outside, then the chapter (verso)
  # or section (recto). No head.
  header:
    recto: { left: { content: '' }, center: { content: '' }, right: { content: '' } }
    verso: { left: { content: '' }, center: { content: '' }, right: { content: '' } }
  # (Its baseline 42.75 pt above the page's foot, 9 point.)
  footer:
    height: 0.875in
    vertical_align: bottom
    padding: [0, 0, 40.4, 0]
    font_size: 9
    font_family: Fira Sans Condensed
    recto:
      left: { content: '' }
      center: { content: '' }
      right: { content: '{section-or-chapter-title} | *{page-number}*' }
    verso:
      left: { content: '*{page-number}* | {chapter-title}' }
      center: { content: '' }
      right: { content: '' }
# The faces on the web, from Google Fonts.
webfonts:
  - Crimson Pro:400,400italic,700,700italic
  - Fira Sans Condensed:400,600
  - Ubuntu Mono:400,400italic,700,700italic
css: |
  .literalblock pre,.listingblock>.content>pre{padding:0 0 0 17pt}
  .admonitionblock>table{border-top:1px solid;border-bottom:1px solid}
  .admonitionblock td.icon .title{text-transform:uppercase}
