# A critical edition after the Oxford Classical Texts (Burnet's Plato,
# Bywater's Aristotle): a small crown octavo (the volumes about 19.4 by
# 13.1 cm bound), the text without commentary, the apparatus criticus at
# the foot of each page, run in, in a smaller size; the lines numbered in
# the outer margin every fifth, counted from each Stephanus section
# (`2a`) or Bekker column, its label beside its first line, with no bar
# in the text. The document turns the numbers on (`:line-numbers:`) and
# says which units they restart at (`line_numbers_restart_units`, here
# `section`); the apparatus is the note stream `app` (`note:app[…]`).
#
# The OCT's Greek is Porson; its free stand-in here is Gentium Book Plus,
# which sets Greek and Latin alike (`ptome doctor --look
# critical-edition`). Facing pages (a Loeb, the original on the verso)
# wait on parallel texts.
tokens:
  font:
    text: { family: { print: Gentium Book Plus, screen: [Gentium Book Plus, Gentium Plus, GFS Porson, serif] } }
    display: { family: { print: Gentium Book Plus, screen: [Gentium Book Plus, Gentium Plus, serif] } }
  size:
    text: { print: 11pt, screen: 19px }
    headings: { print: [14pt, 11pt, 11pt, 11pt, 11pt, 11pt] }
  leading: { print: 1.18, screen: 1.55 }
  measure: { screen: 32em }
  paragraph: { signal: indent, indent: { print: 1em } }
  align: { print: justify }
  hyphenate: { print: true }
  color: { ink: '#000000', link: '#000000' }
  rule: { hairline: { print: 0.4pt, screen: 1px, ebook: 1px } }
  page: { size: [130mm, 192mm], margin: [16mm, 18mm, 18mm, 15mm] }
styles:
  heading: { font: display, weight: normal, color: ink, space-before: { print: 11pt }, space-after: { print: 6pt }, keep-with-next: true }
  title: { font: display, weight: normal, color: ink }
  link: { color: ink }
pdf:
  heading:
    h2: { text_align: center, text_transform: uppercase, letter_spacing: 0.08em }
  title_page:
    text_align: center
  line_numbers:
    interval: 5
    side: outer
    restart: none
    restart_units: section
    font_size: 8
  note_streams: [app]
  note_stream:
    app:
      arrangement: run_in
      run_in_separator: " "
      font_size: 8.5
      line_height: 1.12
      separator_length: 0
      margin_top: 6
      # (No mark in the text: an entry is found by its line.)
      reference_content: ''
      label_content: ''
  # (The Stephanus labels in the margin only, beside the line numbers.)
  role:
    stephanus: { display: none }
  header:
    height: 12mm
    vertical_align: bottom
    font_size: 9
    recto:
      left: { content: '' }
      center: { content: '{section-or-chapter-title}' }
      right: { content: '{page-number}' }
    verso:
      left: { content: '{page-number}' }
      center: { content: '{document-title}' }
      right: { content: '' }
  footer:
    recto: { left: { content: '' }, center: { content: '' }, right: { content: '' } }
    verso: { left: { content: '' }, center: { content: '' }, right: { content: '' } }
css: |
  #content h2{text-align:center;text-transform:uppercase;letter-spacing:.08em}
