# The trade novel: a paperback of fiction in the British B format
# (129 × 198 mm), as doc/typography.md's book-trade tradition sets it.
# An old-style face, 10.25 on 12.25, justified and hyphenated, on a
# baseline grid; paragraphs by a 1 em indent, none after a heading or a
# break; scene breaks as space, an asterism where a page boundary would
# hide them. Each chapter opens a recto a third of the way down, its
# number and title centred above an initial two lines deep and its first
# words in small capitals. Running heads in letterspaced small capitals,
# the book's title on the verso, the chapter's on the recto, the folios
# at the foot's outer corner; notes, which a novel seldom has, 8.25 on 10.
# Margins from the trade profile (the gutter 1.3 times the fore-edge),
# whole lines in the text area.
#
# The face's free stand-in for Garamond and Sabon: EB Garamond
# (`ptome doctor --look trade-novel`).
tokens:
  font:
    text: { family: { print: EB Garamond, screen: [EB Garamond, Garamond, serif] } }
    display: { family: { print: EB Garamond, screen: [EB Garamond, Garamond, serif] }, weight: normal }
  size:
    text: { print: 10.25pt, screen: 19px }
    # The book's title, chapters (a book's level 1), then scene titles.
    headings: { print: [24pt, 14pt, 10.25pt, 10.25pt, 10.25pt, 10.25pt] }
  leading: { print: 1.195, screen: 1.55 }
  measure: { screen: 31em }
  paragraph: { signal: indent, indent: { print: 1em } }
  align: { print: justify }
  hyphenate: { print: true }
  color: { ink: '#000000', link: '#000000' }
  rule: { hairline: { print: 0.4pt, screen: 1px, ebook: 1px } }
  page: { size: [129mm, 198mm], margin: [16mm, 15mm, 20mm, 17mm], grid: true }
styles:
  heading: { font: display, weight: normal, color: ink, space-before: { print: 12.25pt }, space-after: { print: 12.25pt }, keep-with-next: true }
  title: { font: display, weight: normal, color: ink }
  link: { color: ink }
pdf:
  # (10.25 on 12.25 whatever the face's own line spacing.)
  base_line_pitch: 12.25
  page:
    margin_profile: trade
    margin_whole_lines: true
  heading:
    chapter_break_before: always
    # (A chapter on a recto, sunk a third of the page, its title centred
    # and its first paragraph opened by a two-line initial and three words
    # in small capitals.)
    h2:
      text_align: center
      margin_page_top: 150
      margin_bottom: 24.5
      initial_lines: 2
      initial_lead_in: 3
      initial_gap: 0.15em
  # (Capitals and small capitals letterspaced, as Bringhurst asks.)
  caps_letter_spacing: 0.06em
  role:
    lead-in: { font_variant: small-caps }
    running-head: { font_variant: small-caps, text_transform: lowercase }
  # (No space below a paragraph, before a scene break or anything else:
  # the grid's lines run unbroken but for a break's one.)
  prose:
    margin_bottom: 0
  # (A scene break one blank line; the asterisk only where it falls at a
  # page's foot or head, which would hide the space.)
  thematic_break_content: '*'
  thematic_break_content_display: boundary
  thematic_break_padding: 0
  thematic_break_margin_top: 0
  thematic_break_margin_bottom: 0
  footnotes:
    font_size: 8.25
    line_height: 1.21
  title_page:
    text_align: center
  header:
    height: 13mm
    vertical_align: bottom
    font_size: 8.5
    recto:
      left: { content: '' }
      center: { content: '[.running-head]#{chapter-title}#' }
      right: { content: '' }
    verso:
      left: { content: '' }
      center: { content: '[.running-head]#{document-title}#' }
      right: { content: '' }
  footer:
    height: 13mm
    font_size: 8.5
    border_width: 0
    recto: { left: { content: '' }, center: { content: '' }, right: { content: '{page-number}' } }
    verso: { left: { content: '{page-number}' }, center: { content: '' }, right: { content: '' } }
webfonts:
  - EB Garamond:400,400italic,700,700italic
css: |
  #content h2{text-align:center;margin-top:30vh}
  #content .sect1>.sectionbody>.paragraph:first-child>p::first-line{font-variant:small-caps}
