# The corpus (test/corpus_<n>_test.dart) compares ptome with Asciidoctor's
# own files, held to its red list (test/corpus/red.txt); `dart test -t
# corpus` runs it alone.
tags:
  corpus:
    timeout: 2x

# On Node.js, the test program's socket to the runner without Nagle's
# delay (tool/node_no_delay.cjs): ~40 ms a test otherwise.
override_platforms:
  node:
    settings:
      arguments: --require ./tool/node_no_delay.cjs
