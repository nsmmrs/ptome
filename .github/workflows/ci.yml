name: CI
# Every test, every check, on every push to master and nothing else: no
# pull requests, no schedule, no other branches. The jobs run side by
# side, each a share of the whole, so the run takes as long as its longest
# job; tool/gate.sh runs the same checks locally before a commit.
on:
  push:
    branches: [master]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions: read-all
# The tests' world, as tool/gate.sh sets it: no font installed on the
# runner, one date and time zone.
env:
  PTOME_SYSTEM_FONTS: 'off'
  SOURCE_DATE_EPOCH: '1767225600'
  TZ: UTC
defaults:
  run:
    shell: bash
jobs:
  checks:
    # Formatting and analysis of the whole workspace (the packages' shared
    # test helpers alike, no test depending on the machine); the public
    # APIs against their snapshots, ptome's JavaScript projection against
    # its generator, plain_highlighting's generated grammars and
    # references against the pinned highlight.js (vendor/ its release).
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
    - uses: actions/checkout@v4
    - uses: dart-lang/setup-dart@v1
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - uses: actions/cache@v4
      with:
        path: ~/.pub-cache
        key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
    - run: dart pub get
    - name: Analysis, the APIs, the JavaScript projection, the generated grammars
      run: |
        (cd packages/ptome && dart run tool/generate_js.dart --check) > "$RUNNER_TEMP/js.log" 2>&1 &
        js=$!
        (cd packages/plain_highlighting &&
          (cd tool/generate && npm ci --silent) &&
          node tool/generate/generate.mjs &&
          node tool/generate/reference.mjs &&
          dart format lib/src/languages > /dev/null &&
          git diff --exit-code &&
          tool/vendor.sh --check) > "$RUNNER_TEMP/generated.log" 2>&1 &
        generated=$!
        dart run tool/api_check.dart > "$RUNNER_TEMP/api.log" 2>&1 &
        api=$!
        status=0
        dart analyze --fatal-infos . || status=1
        dart format --output=none --set-exit-if-changed packages || status=1
        tool/oracles_check.sh || status=1
        tool/hermetic_check.sh || status=1
        wait "$api" || status=1
        cat "$RUNNER_TEMP/api.log"
        wait "$js" || { cat "$RUNNER_TEMP/js.log"; status=1; }
        wait "$generated" || { cat "$RUNNER_TEMP/generated.log"; status=1; }
        exit $status
  tests:
    # Every package's tests on each system, dealt into shards of about the
    # same time (tool/shard.dart), each held to the tests' budget
    # (tool/test_budget.dart) and ptome's corpus to its red list.
    strategy:
      fail-fast: false
      matrix:
        include:
        - {os: ubuntu-latest, shards: 5, shard: 0}
        - {os: ubuntu-latest, shards: 5, shard: 1}
        - {os: ubuntu-latest, shards: 5, shard: 2}
        - {os: ubuntu-latest, shards: 5, shard: 3}
        - {os: ubuntu-latest, shards: 5, shard: 4}
        - {os: macos-latest, shards: 4, shard: 0}
        - {os: macos-latest, shards: 4, shard: 1}
        - {os: macos-latest, shards: 4, shard: 2}
        - {os: macos-latest, shards: 4, shard: 3}
        - {os: windows-latest, shards: 3, shard: 0}
        - {os: windows-latest, shards: 3, shard: 1}
        - {os: windows-latest, shards: 3, shard: 2}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 3
    name: tests (${{ matrix.os }}, ${{ matrix.shard }} of ${{ matrix.shards }})
    steps:
    - uses: actions/checkout@v4
    - uses: dart-lang/setup-dart@v1
    - uses: actions/cache@v4
      with:
        path: ~/.pub-cache
        key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
    - run: dart pub get
    # (The test runner's incremental kernels, the shard's last run's: only
    # what changed since is compiled again.)
    - uses: actions/cache@v4
      with:
        path: packages/*/.dart_tool/test
        key: test-kernel-${{ runner.os }}-${{ matrix.shards }}-${{ matrix.shard }}-${{ github.sha }}
        restore-keys: test-kernel-${{ runner.os }}-${{ matrix.shards }}-${{ matrix.shard }}-
    - name: The shard's tests
      run: |
        packages="$(cd packages && for p in */; do if [ -d "$p/test" ]; then echo "${p%/}"; fi; done)"
        reports=()
        status=0
        while read -r package files; do
          echo "::group::$package"
          (cd "packages/$package" &&
            dart test -j 4 --file-reporter "json:$RUNNER_TEMP/$package.json" $files) || status=1
          echo "::endgroup::"
          reports+=("$package=$RUNNER_TEMP/$package.json")
        done < <(dart run tool/shard.dart ${{ matrix.shards }} ${{ matrix.shard }} $packages)
        if [ -f "$RUNNER_TEMP/ptome.json" ]; then
          (cd packages/ptome && dart run tool/corpus_red.dart "$RUNNER_TEMP/ptome.json") || status=1
        fi
        dart run tool/test_budget.dart "${reports[@]}" || status=1
        exit $status
  node:
    # ptome's suites on Node.js, in four programs (tool/node_tests.dart),
    # a job each (each is a whole dart2js compile).
    strategy:
      fail-fast: false
      matrix:
        programs: ['0', '1', '2', '3']
    runs-on: ubuntu-latest
    timeout-minutes: 3
    defaults:
      run:
        working-directory: packages/ptome
    steps:
    - uses: actions/checkout@v4
    - uses: dart-lang/setup-dart@v1
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - uses: actions/cache@v4
      with:
        path: ~/.pub-cache
        key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
    - run: dart pub get
    - name: The programs' tests on Node.js
      run: |
        dart run tool/node_tests.dart
        dart test -p node $(for p in ${{ matrix.programs }}; do echo "build/node_tests/bucket${p}_test.dart"; done)
  web:
    # Each library compiled to JavaScript writes the same bytes as on the
    # Dart VM (its tool/web_check.dart).
    strategy:
      fail-fast: false
      matrix:
        packages:
        - plain_compression plain_fonts plain_highlighting plain_hyphenation plain_images plain_math
        - plain_mustache plain_pdf plain_svg plain_typesetting plain_unicode
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
    - uses: actions/checkout@v4
    - uses: dart-lang/setup-dart@v1
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - uses: actions/cache@v4
      with:
        path: ~/.pub-cache
        key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
    - run: dart pub get
    - name: JavaScript writes the same bytes as the VM
      run: |
        check() {
          cd "packages/$1"
          dart compile js -O2 -o build/web_check.js tool/web_check.dart > /dev/null
          vm="$(dart run tool/web_check.dart)"
          js="$(node build/web_check.js)"
          [ "$vm" = "$js" ] && echo "$1: the same" || { echo "$1: VM $vm, JS $js"; return 1; }
        }
        export -f check
        echo ${{ matrix.packages }} | tr ' ' '\n' | xargs -P 4 -I{} bash -c 'check {}'
  npm:
    # The npm package: built, its own tests (API, exports, contents,
    # bundler, browser), types and lint, a publish dry run (nothing is
    # published), and the CLI's file handling on Node.
    runs-on: ubuntu-latest
    timeout-minutes: 3
    defaults:
      run:
        working-directory: packages/ptome
    steps:
    - uses: actions/checkout@v4
    - uses: dart-lang/setup-dart@v1
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - uses: actions/cache@v4
      with:
        path: ~/.pub-cache
        key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
    - run: dart pub get
    - run: ./tool/build-npm.sh
    - working-directory: packages/ptome/test/npm
      run: npm ci
    - name: The package's tests, types and lint
      working-directory: packages/ptome/test/npm
      env:
        CHROMIUM_PATH: /usr/bin/google-chrome
      run: |
        node --test
        npm run types
        npm run lint
    - name: Publish dry run
      working-directory: packages/ptome/build/npm
      run: npm publish --dry-run
    - name: The CLI's file handling on Node
      env:
        ASCIIDOCTOR_EXE: test/e2e/bin/ptome-node
      run: |
        sudo npm i -g bats
        bats test/e2e/cli_output_files.bats
  cli:
    # The CLI's end-to-end suite (bats) on the compiled executable; each
    # package would publish (a dry run: no errors or warnings, but
    # depending on siblings not released yet; tool/publish_check.sh), and
    # resolves and analyzes on its own against its siblings' published
    # versions (tool/standalone.sh).
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
    - uses: actions/checkout@v4
    - uses: dart-lang/setup-dart@v1
    - uses: actions/cache@v4
      with:
        path: ~/.pub-cache
        key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
    - run: dart pub get
    - run: |
        tool/publish_check.sh > "$RUNNER_TEMP/publish.log" 2>&1 &
        publish=$!
        # (standalone.sh edits the pubspecs as it goes: in a copy, beside
        # the publish check that reads them.)
        cp -a . "$RUNNER_TEMP/standalone"
        (cd "$RUNNER_TEMP/standalone" && tool/standalone.sh) > "$RUNNER_TEMP/standalone.log" 2>&1 &
        standalone=$!
        (sudo npm i -g bats > /dev/null) &
        bats=$!
        status=0
        (cd packages/ptome &&
          dart compile exe -o "$RUNNER_TEMP/ptome" bin/ptome.dart > /dev/null) || status=1
        wait "$bats" || status=1
        (cd packages/ptome &&
          ASCIIDOCTOR_EXE="$RUNNER_TEMP/ptome" bats test/e2e/) || status=1
        wait "$publish" || { cat "$RUNNER_TEMP/publish.log"; status=1; }
        wait "$standalone" || { cat "$RUNNER_TEMP/standalone.log"; status=1; }
        exit $status
