name: CI
# Every test, every check, on every push to master and nothing else: no
# pull requests, no schedule, no other branches. The jobs run side by
# side, each a share of the whole, so the run takes as long as its longest
# job; tool/gate.sh runs the same checks locally before a commit.
on:
  push:
    branches: [master]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions: read-all
# The tests' world, as tool/gate.sh sets it: no font installed on the
# runner, one date and time zone.
env:
  PTOME_SYSTEM_FONTS: 'off'
  SOURCE_DATE_EPOCH: '1767225600'
  TZ: UTC
defaults:
  run:
    shell: bash
jobs:
  checks:
    # Formatting and analysis of the whole workspace (the packages' shared
    # test helpers alike, no test depending on the machine); the public
    # APIs against their snapshots, ptome's JavaScript projection against
    # its generator, plain_highlighting's generated grammars and
    # references against the pinned highlight.js (vendor/ its release).
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/setup
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    # (The analyzer's own cache, of what it found in each file's contents:
    # a run reads what didn't change since the last from it.)
    - uses: actions/cache@v4
      with:
        path: ~/.dartServer
        key: analyzer-${{ github.sha }}
        restore-keys: analyzer-
    - name: Analysis, the APIs, the JavaScript projection, the generated grammars
      run: |
        (cd packages/ptome && dart run tool/generate_js.dart --check) > "$RUNNER_TEMP/js.log" 2>&1 &
        js=$!
        # (The grammars generated in a copy of the package: the generator
        # rewrites them, where the analysis and the format check read.)
        here="$PWD/packages/plain_highlighting"
        cp -a "$here" "$RUNNER_TEMP/highlighting"
        (cd "$RUNNER_TEMP/highlighting" &&
          (cd tool/generate && npm ci --silent) &&
          node tool/generate/generate.mjs &&
          node tool/generate/reference.mjs &&
          dart format --language-version=3.13 lib/src/languages > /dev/null &&
          diff -r lib/src/languages "$here/lib/src/languages" &&
          diff test/reference/detect.json "$here/test/reference/detect.json" &&
          tool/vendor.sh --check) > "$RUNNER_TEMP/generated.log" 2>&1 &
        generated=$!
        dart run tool/api_check.dart > "$RUNNER_TEMP/api.log" 2>&1 &
        api=$!
        status=0
        dart analyze --fatal-infos . || status=1
        dart format --output=none --set-exit-if-changed packages || status=1
        tool/oracles_check.sh || status=1
        tool/hermetic_check.sh || status=1
        wait "$api" || status=1
        cat "$RUNNER_TEMP/api.log"
        wait "$js" || { cat "$RUNNER_TEMP/js.log"; status=1; }
        wait "$generated" || { cat "$RUNNER_TEMP/generated.log"; status=1; }
        exit $status
  tests:
    # Every package's tests on each system, dealt into shards of about the
    # same time, each shard's in four programs side by side
    # (tool/test_shard.sh, as the gate runs them), held to the tests'
    # budget (tool/test_budget.dart) and ptome's corpus to its red list.
    strategy:
      fail-fast: false
      matrix:
        include:
        - {os: ubuntu-latest, shards: 3, shard: 0}
        - {os: ubuntu-latest, shards: 3, shard: 1}
        - {os: ubuntu-latest, shards: 3, shard: 2}
        - {os: macos-latest, shards: 4, shard: 0}
        - {os: macos-latest, shards: 4, shard: 1}
        - {os: macos-latest, shards: 4, shard: 2}
        - {os: macos-latest, shards: 4, shard: 3}
        - {os: windows-latest, shards: 5, shard: 0}
        - {os: windows-latest, shards: 5, shard: 1}
        - {os: windows-latest, shards: 5, shard: 2}
        - {os: windows-latest, shards: 5, shard: 3}
        - {os: windows-latest, shards: 5, shard: 4}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 3
    name: tests (${{ matrix.os }}, ${{ matrix.shard }} of ${{ matrix.shards }})
    steps:
    # (Windows Defender scans each file the job writes as it is written:
    # the checkout's, the pub cache's, the compilers'. Not on a runner
    # thrown away after the job.)
    - if: runner.os == 'Windows'
      shell: pwsh
      run: Set-MpPreference -DisableRealtimeMonitoring $true
    - uses: actions/checkout@v4
    - uses: ./.github/actions/setup
    - name: The shard's tests
      # (A program a core the runner has.)
      run: |
        cores="$(nproc 2> /dev/null || sysctl -n hw.ncpu)"
        tool/test_shard.sh --budget ${{ matrix.shards }} ${{ matrix.shard }} "$cores" "$RUNNER_TEMP/tests"
  node:
    # ptome's suites on Node.js, in four programs (tool/node_tests.dart),
    # a job each (each is a whole dart2js compile).
    strategy:
      fail-fast: false
      matrix:
        programs: ['0', '1', '2', '3']
    runs-on: ubuntu-latest
    timeout-minutes: 3
    defaults:
      run:
        working-directory: packages/ptome
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/setup
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: The programs' tests on Node.js
      run: |
        dart run tool/node_tests.dart
        dart test -p node $(for p in ${{ matrix.programs }}; do echo "build/node_tests/bucket${p}_test.dart"; done)
  web:
    # Each library compiled to JavaScript writes the same bytes as on the
    # Dart VM (its tool/web_check.dart).
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/setup
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: JavaScript writes the same bytes as the VM
      run: |
        check() {
          cd "packages/$1"
          dart compile js -O2 -o build/web_check.js tool/web_check.dart > /dev/null
          vm="$(dart run tool/web_check.dart)"
          js="$(node build/web_check.js)"
          [ "$vm" = "$js" ] && echo "$1: the same" || { echo "$1: VM $vm, JS $js"; return 1; }
        }
        export -f check
        ls -d packages/plain_*/tool/web_check.dart | cut -d/ -f2 | xargs -P 4 -I{} bash -c 'check {}'
  npm:
    # The npm package: built, its own tests (API, exports, contents,
    # bundler, browser), types and lint, a publish dry run (nothing is
    # published), and the CLI's file handling on Node.
    runs-on: ubuntu-latest
    timeout-minutes: 3
    defaults:
      run:
        working-directory: packages/ptome
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/setup
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: The package built (its tests' dependencies and bats beside it)
      run: |
        (cd test/npm && npm ci --silent) > "$RUNNER_TEMP/deps.log" 2>&1 &
        deps=$!
        sudo npm i -g bats > "$RUNNER_TEMP/bats.log" 2>&1 &
        bats=$!
        ./tool/build-npm.sh
        wait "$deps" || { cat "$RUNNER_TEMP/deps.log"; exit 1; }
        wait "$bats" || { cat "$RUNNER_TEMP/bats.log"; exit 1; }
    - name: Its tests, types, lint and publish dry run; the CLI's file handling on Node
      env:
        CHROMIUM_PATH: /usr/bin/google-chrome
        ASCIIDOCTOR_EXE: test/e2e/bin/ptome-node
      run: |
        # (Side by side, each into its log, printed when all are done.)
        names=() pids=()
        part() {
          names+=("$1")
          (cd "$2" && shift 2 && "$@") > "$RUNNER_TEMP/$1.log" 2>&1 &
          pids+=($!)
        }
        part tests test/npm node --test
        part types test/npm npm run types
        part lint test/npm npm run lint
        part publish build/npm npm publish --dry-run
        part bats . bats test/e2e/cli_output_files.bats
        status=0
        for i in "${!names[@]}"; do
          if wait "${pids[$i]}"; then echo "${names[$i]}: passed"; else
            echo "${names[$i]}: FAILED"; cat "$RUNNER_TEMP/${names[$i]}.log"; status=1
          fi
        done
        exit $status
  cli:
    # The CLI's end-to-end suite (bats) on the compiled executable; each
    # package would publish (a dry run: no errors or warnings, but
    # depending on siblings not released yet; tool/publish_check.sh), and
    # resolves and analyzes on its own against its siblings' published
    # versions (tool/standalone.sh).
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/setup
    - run: |
        tool/publish_check.sh > "$RUNNER_TEMP/publish.log" 2>&1 &
        publish=$!
        # (standalone.sh edits the pubspecs as it goes: in a copy, beside
        # the publish check that reads them.)
        cp -a . "$RUNNER_TEMP/standalone"
        (cd "$RUNNER_TEMP/standalone" && tool/standalone.sh) > "$RUNNER_TEMP/standalone.log" 2>&1 &
        standalone=$!
        (sudo npm i -g bats > /dev/null) &
        bats=$!
        status=0
        (cd packages/ptome &&
          dart compile exe -o "$RUNNER_TEMP/ptome" bin/ptome.dart > /dev/null) || status=1
        wait "$bats" || status=1
        (cd packages/ptome &&
          ASCIIDOCTOR_EXE="$RUNNER_TEMP/ptome" bats test/e2e/) || status=1
        wait "$publish" || { cat "$RUNNER_TEMP/publish.log"; status=1; }
        wait "$standalone" || { cat "$RUNNER_TEMP/standalone.log"; status=1; }
        exit $status
