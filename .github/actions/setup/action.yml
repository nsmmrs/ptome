name: Dart and the packages
description: >-
  The Dart SDK CI runs, pinned (every job and every run the same: raise it
  here), and the workspace's dependencies, each from the cache where it
  has them.
runs:
  using: composite
  steps:
  # (On Linux and macOS the SDK and the pub cache come back together, and
  # setup-dart finds the SDK in the tool cache where it would unzip its
  # download, ~12 s. Windows' tar is slower than its unzip. pubspec.lock
  # isn't committed: the pubspecs key the dependencies.)
  - if: runner.os != 'Windows'
    uses: actions/cache@v4
    with:
      path: |
        ${{ runner.tool_cache }}/dart
        ~/.pub-cache
      key: dart-${{ runner.os }}-${{ runner.arch }}-3.13.5-${{ hashFiles('**/pubspec.yaml') }}
      restore-keys: dart-${{ runner.os }}-${{ runner.arch }}-3.13.5-
  # (Its problem matcher, a file of its own, isn't found from a composite
  # action: the analysis prints its findings anyway.)
  - uses: dart-lang/setup-dart@v1
    with:
      sdk: 3.13.5
      problem-matcher: 'false'
  # (On Windows the pub cache and the temporary files on the runner's D:
  # drive, beside the checkout, where C: is slower to write many small
  # files to.)
  - if: runner.os == 'Windows'
    shell: bash
    run: |
      cache="$(cd "$RUNNER_TEMP/.." && pwd)/pub-cache"
      mkdir -p "$cache"
      echo "PUB_CACHE=$(cygpath -w "$cache")" >> "$GITHUB_ENV"
      echo "TEMP=$(cygpath -w "$RUNNER_TEMP")" >> "$GITHUB_ENV"
      echo "TMP=$(cygpath -w "$RUNNER_TEMP")" >> "$GITHUB_ENV"
  - if: runner.os == 'Windows'
    uses: actions/cache@v4
    with:
      path: ${{ env.PUB_CACHE }}
      key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.yaml') }}
      restore-keys: pub-${{ runner.os }}-
  - shell: bash
    run: dart pub get
